name: EAS local build setup
description: >-
  Prepare a GitHub-hosted runner to run `eas build --local` for one mobile platform, or to warm the
  caches that such a build reads.

# `pr-development-builds.yml`, `release.yml`, and `cache-warm.yml` must agree on every input that
# feeds a cache key -- the Node/Bun versions, the NDK, the Cargo environment, and the EAS CLI
# version all land in one key or another. Keeping the setup in one action is what makes that
# agreement structural instead of a comment three files away.
#
# The caller still owns the checkout: a workflow cannot reference a local action before the
# repository is on disk, and each workflow checks out a different revision.
inputs:
  platform:
    description: Mobile platform this runner builds for (ios or android).
    required: true
  eas-cli-version:
    description: EAS CLI version to install globally.
    required: true
  save-caches:
    description: >-
      Whether to write the Bun/npm and Cargo caches. Only jobs running on main should set this: a
      cache written by a pull_request run lands in that PR's own scope, where no other pull request
      can read it, while still counting against the repository's 10 GB budget.
    required: false
    default: 'false'
  native-dependency-cache:
    description: >-
      Whether to restore the CocoaPods/Gradle download caches. Only `eas build --local` fills them,
      so the warm job has no use for them.
    required: false
    default: 'true'

outputs:
  native-cache-key:
    description: Primary key of the restored CocoaPods/Gradle cache, for the caller's save step.
    value: ${{ steps.cocoapods-cache.outputs.cache-primary-key }}${{ steps.gradle-cache.outputs.cache-primary-key }}
  native-cache-hit:
    description: Whether the CocoaPods/Gradle cache was an exact hit.
    value: ${{ steps.cocoapods-cache.outputs.cache-hit }}${{ steps.gradle-cache.outputs.cache-hit }}
  # Reported in the build's job summary by scripts/build-report.sh. A build whose duration is
  # surprising is almost always a build whose caches missed, and until these were surfaced that was
  # invisible: all four restores happen inside this composite action, which the Actions UI collapses
  # into a single "Prepare the runner" step.
  js-cache-hit:
    description: Whether the Bun/npm download cache was an exact hit.
    value: ${{ steps.js-cache.outputs.cache-hit }}
  cargo-cache-hit:
    description: Whether the Cargo registry/target cache was an exact hit.
    value: ${{ steps.cargo-cache.outputs.cache-hit }}
  artifact-cache-hit:
    description: Whether the prebuilt native artifact cache was an exact hit.
    value: ${{ steps.artifact-cache.outputs.cache-hit }}
  artifact-cache-key:
    description: Primary key of the restored native artifact cache, for the caller's save step.
    value: ${{ steps.artifact-cache.outputs.cache-primary-key }}
  ccache-hit:
    description: Whether the ccache was an exact hit.
    value: ${{ steps.ccache-ios.outputs.cache-hit }}${{ steps.ccache-android.outputs.cache-hit }}
  ccache-key:
    description: Primary key of the restored ccache, for the caller's save step.
    value: ${{ steps.ccache-ios.outputs.cache-primary-key }}${{ steps.ccache-android.outputs.cache-primary-key }}
  ccache-path:
    description: Directory the ccache lives in on this platform, for the caller's save step.
    value: ${{ inputs.platform == 'ios' && '~/Library/Caches/ccache' || '~/.cache/ccache' }}
  metro-cache-hit:
    description: Whether the Metro transform cache was an exact hit.
    value: ${{ steps.metro-cache.outputs.cache-hit }}
  metro-cache-key:
    description: Primary key of the restored Metro transform cache, for the caller's save step.
    value: ${{ steps.metro-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Validate the platform
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        case "$PLATFORM" in
          ios | android) ;;
          *)
            echo "Unsupported platform: $PLATFORM" >&2
            exit 1
            ;;
        esac

    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22.23.1

    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    - name: Restore the JavaScript package caches
      id: js-cache
      uses: ./.github/actions/eas-js-cache
      with:
        eas-cli-version: ${{ inputs.eas-cli-version }}
        save: ${{ inputs.save-caches }}

    - name: Install project dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # SDK 58 builds against the iOS 27 SDK (the scene life cycle it requires is what keeps the app
    # launching on iOS 27), and 27.1 is the first with the iPhone Duo runtime. `macos-latest` (macOS
    # 26) ships only Xcode 26, so the iOS jobs run on GitHub's `xcode-27` image (public preview).
    # Pinned to the stable release, not the newest present: that image also carries a 27.2 release
    # candidate, and a release build must not drift onto a pre-release toolchain.
    - name: Select the SDK 58 Xcode toolchain (Xcode 27.1)
      if: inputs.platform == 'ios'
      shell: bash
      run: |
        set -euo pipefail
        sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
        xcodebuild -version

    - name: Install the SDK 58 Android NDK
      if: inputs.platform == 'android'
      shell: bash
      run: |
        set -euo pipefail
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006"
        ndk_home="$ANDROID_HOME/ndk/27.1.12297006"
        {
          echo "ANDROID_NDK=$ndk_home"
          echo "ANDROID_NDK_HOME=$ndk_home"
          echo "ANDROID_NDK_ROOT=$ndk_home"
        } >> "$GITHUB_ENV"

    - name: Restore the Cargo cache
      id: cargo-cache
      uses: ./.github/actions/eas-rust-cache
      with:
        platform: ${{ inputs.platform }}
        save: ${{ inputs.save-caches }}

    # Restored for every job, including the warm job: warming is exactly the case where staging the
    # finished artifacts is the point.
    - name: Restore the prebuilt native artifacts
      id: artifact-cache
      uses: ./.github/actions/eas-native-cache
      with:
        platform: ${{ inputs.platform }}
        save: ${{ inputs.save-caches }}

    - name: Restore the CocoaPods download cache
      id: cocoapods-cache
      if: inputs.platform == 'ios' && inputs.native-dependency-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/CocoaPods
        key: eas-local-cocoapods-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'app.json', 'app.config.ts', 'modules/iroh-location/ios/IrohLocation.podspec') }}
        restore-keys: |
          eas-local-cocoapods-${{ runner.os }}-

    # build-cache-1 is the odd one out here: everything else in this list is a DOWNLOAD cache, and
    # it is the only entry that lets a compile task be skipped rather than repeated. It was missing,
    # which meant no Android build ever reused a task output from another run. It only fills when
    # org.gradle.caching is on -- see GRADLE_OPTS in the workflows.
    - name: Restore the Gradle dependency and build caches
      id: gradle-cache
      if: inputs.platform == 'android' && inputs.native-dependency-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/caches/jars-*
          ~/.gradle/caches/transforms-*
          ~/.gradle/caches/build-cache-1
          ~/.gradle/wrapper
        key: eas-local-gradle-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'app.json', 'app.config.ts', 'modules/iroh-location/android/build.gradle') }}
        restore-keys: |
          eas-local-gradle-${{ runner.os }}-

    # Both platforms spend minutes compiling the same third-party C, C++ and Objective-C on every
    # run: Xcode the pods, Gradle the React Native libraries' CMake builds (`buildCMake*` tasks,
    # which Gradle's build cache does not cover). Swift and Kotlin are not covered: ccache only
    # wraps C-family compilers.
    #
    # iOS: `ios.ccacheEnabled` (app.json) makes the Podfile route CC/CXX through React Native's
    # ccache wrappers, and scripts/eas-build-post-install.sh pins the binary those wrappers run.
    # Android: CMake reads CMAKE_<LANG>_COMPILER_LAUNCHER from the environment, which reaches every
    # library's CMake configure through Gradle.
    #
    # Hits need no base_dir rewriting: the callers pin EAS_LOCAL_BUILD_WORKINGDIR, so every run
    # compiles the same files at the same absolute paths.
    - name: Install ccache
      if: inputs.native-dependency-cache == 'true'
      shell: bash
      env:
        CCACHE_VERSION: 4.14.2
        PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        if [[ "$PLATFORM" == ios ]]; then
          build="darwin"
          sha256="cf240009630b605b775c7c5c7b7105a3b196c79f31af322c1557969aa28003fc"
        else
          build="linux-x86_64-musl-static"
          sha256="d540ba01f160addbd3dd5e18eda9bd34005591b095c09ac8ae9d0a1b655e7ef5"
        fi
        archive="$RUNNER_TEMP/ccache.tar.gz"
        curl --fail --location --silent --show-error --output "$archive" \
          "https://github.com/ccache/ccache/releases/download/v$CCACHE_VERSION/ccache-$CCACHE_VERSION-$build.tar.gz"
        # Not `sha256sum` wherever it exists: macOS now ships a BSD one whose --check rejects
        # this line format, and that failed every iOS job at setup.
        if [[ "$PLATFORM" == ios ]]; then
          echo "$sha256  $archive" | shasum -a 256 --check
        else
          echo "$sha256  $archive" | sha256sum --check
        fi
        tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
        sudo install -m 0755 "$RUNNER_TEMP/ccache-$CCACHE_VERSION-$build/ccache" /usr/local/bin/ccache
        ccache --version | head -1
        # base_dir + nohashdir make every path under RUNNER_TEMP (EAS's working copy included)
        # relative before hashing: the second Android build with a restored cache missed all 169
        # compiles, so something in the absolute paths or working directory differs per run. The
        # log is for the report, which prints only the working directories ccache saw.
        {
          echo "CCACHE_BASEDIR=$RUNNER_TEMP"
          echo "CCACHE_NOHASHDIR=true"
          echo "CCACHE_LOGFILE=$RUNNER_TEMP/ccache.log"
        } >> "$GITHUB_ENV"
        if [[ "$PLATFORM" == android ]]; then
          {
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            # The same sloppiness React Native's ccache.conf gives iOS. Without pch_defines and
            # time_macros, 178 of 351 Android calls were "could not use precompiled header", and
            # the mtime/ctime pair keeps direct mode for headers the build generates just before
            # compiling them.
            echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime,system_headers"
            echo "CMAKE_C_COMPILER_LAUNCHER=/usr/local/bin/ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=/usr/local/bin/ccache"
          } >> "$GITHUB_ENV"
        fi

    # Every run saves a new entry (the run id ends the key) and restores the newest one with the
    # same native inputs, falling back to any entry for the toolchain: the same pull request's
    # previous run, or the last release's on main. A fixed key would be saved once and then
    # frozen, since an exact hit skips the save -- which is how a hashing change left the iOS cache
    # serving entries nothing could hit. The cache is small, so per-run entries are cheap. The
    # toolchain version is in the key because both configurations set `system_headers` sloppiness,
    # so an SDK or NDK change alone would not invalidate an entry.
    - name: Restore the iOS ccache
      id: ccache-ios
      if: inputs.platform == 'ios' && inputs.native-dependency-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ccache
        key: eas-local-ccache-ios-${{ runner.os }}-${{ runner.arch }}-xcode-27.1-${{ hashFiles('bun.lock', 'app.json', 'app.config.ts', 'patches/**', 'plugins/*.js', 'modules/*/ios/**') }}-${{ github.run_id }}
        restore-keys: |
          eas-local-ccache-ios-${{ runner.os }}-${{ runner.arch }}-xcode-27.1-

    - name: Restore the Android ccache
      id: ccache-android
      if: inputs.platform == 'android' && inputs.native-dependency-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: eas-local-ccache-android-${{ runner.os }}-${{ runner.arch }}-ndk-27.1.12297006-${{ hashFiles('bun.lock', 'app.json', 'app.config.ts', 'patches/**', 'plugins/*.js', 'modules/*/android/**') }}-${{ github.run_id }}
        restore-keys: |
          eas-local-ccache-android-${{ runner.os }}-${{ runner.arch }}-ndk-27.1.12297006-

    # Zeroed after the restore, so the caller's report counts this build, not the ones that filled it.
    - name: Reset ccache statistics
      if: inputs.native-dependency-cache == 'true'
      shell: bash
      run: ccache --zero-stats

    # Expo's Metro config has a build-runner mode: with both variables set it reads entries from
    # RESTORE and writes every entry the bundle used -- hits included -- to OUTPUT, so saving OUTPUT
    # stores exactly this build's working set and an entry nothing uses any more is dropped instead
    # of carried forward. Metro keys each transform by file content and transformer config, so a
    # stale entry is a miss, never a wrong transform. Gradle (`createBundleReleaseJsAndAssets`) and
    # Xcode's bundle phase both inherit the variables through `eas build --local`.
    - name: Point Metro at the build cache directories
      if: inputs.native-dependency-cache == 'true'
      shell: bash
      run: |
        set -euo pipefail
        restore_dir="$RUNNER_TEMP/metro-cache"
        output_dir="$RUNNER_TEMP/metro-cache-output"
        rm -rf -- "$output_dir"
        mkdir -p -- "$restore_dir" "$output_dir"
        {
          echo "EXPO_METRO_CACHE_RESTORE_DIR=$restore_dir"
          echo "EXPO_METRO_CACHE_OUTPUT_DIR=$output_dir"
        } >> "$GITHUB_ENV"

    # The second hash covers the JS the bundle is built from, so a push that changes only native
    # code hits exactly and saves nothing; any JS change falls back to the newest entry for the
    # same dependency set, then to any entry at all.
    - name: Restore the Metro transform cache
      id: metro-cache
      if: inputs.native-dependency-cache == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/metro-cache
        key: eas-local-metro-${{ inputs.platform }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'app.json', 'app.config.ts', 'metro.config.js', 'patches/**') }}-${{ hashFiles('src/**', 'assets/**', 'modules/*/index.ts', 'modules/*/src/**') }}
        restore-keys: |
          eas-local-metro-${{ inputs.platform }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'app.json', 'app.config.ts', 'metro.config.js', 'patches/**') }}-
          eas-local-metro-${{ inputs.platform }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Install EAS CLI
      shell: bash
      env:
        EAS_CLI_VERSION: ${{ inputs.eas-cli-version }}
      run: bun add --global "eas-cli@$EAS_CLI_VERSION"
