name: EAS local build native artifact cache
description: >-
  Restore (and, on main, save) the prebuilt iroh-location native artifacts that
  scripts/eas-build-pre-install.sh would otherwise compile from scratch on every run.

# The Cargo cache next door saves the COMPILER's inputs -- the registry, and whatever of the target
# directory survives. This one saves the build's OUTPUTS: the .so per ABI, the iOS XCFramework, and
# the UniFFI bindings generated alongside them. The difference matters because most pull requests
# change no Rust at all, and for those the entire native phase becomes a copy.
#
# Two things make that sound:
#
#   1. The hook computes the key here and recomputes it in the EAS build copy. Both also check
#      that the archive has the requested native outputs and bindings.
#   2. The bindings are cached WITH the artifacts. UniFFI aborts at load time when generated
#      bindings do not match the library's API checksums, so restoring one without the other would
#      trade build time for a crash on device. Restoring both makes a hit exactly equivalent to
#      having run the build.
#
# Contents are ordinary build outputs of source in this repository. No credential is involved:
# signing happens later, inside Xcode and Gradle, long after this hook has finished.
inputs:
  platform:
    description: Mobile platform whose artifacts are being cached (ios or android).
    required: true
  save:
    description: >-
      Whether to write the cache. Only the main-branch warm job should set this, for the same
      reason as the Cargo and Bun caches: a pull_request run writes into its own
      refs/pull/<n>/merge scope, where no other pull request can read it, while still counting
      against the repository's 10 GB budget.
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: Whether the restored artifacts pass the hook's cache check.
    value: ${{ steps.verify.outputs.ready }}
  cache-primary-key:
    description: Primary key of the restored entry, for the caller's save step.
    value: ${{ steps.identity.outputs.key }}

runs:
  using: composite
  steps:
    - name: Resolve native artifact identity
      id: identity
      shell: bash
      env:
        EAS_BUILD_PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        case "$EAS_BUILD_PLATFORM" in
          ios | android) ;;
          *)
            echo "Unsupported platform: $EAS_BUILD_PLATFORM" >&2
            exit 1
            ;;
        esac
        toolchain="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
        [[ -n "$toolchain" ]]
        rustup toolchain install "$toolchain" --profile minimal --no-self-update
        digest="$(bash scripts/eas-build-pre-install.sh --cache-key)"
        [[ "$digest" =~ ^[0-9a-f]{40}$ ]]
        full="eas-local-native-v3-$EAS_BUILD_PLATFORM-$RUNNER_OS-$RUNNER_ARCH-full-$digest"
        key="$full"
        if [[ "$EAS_BUILD_PLATFORM" == android && -n "${SC_ANDROID_ABIS:-}" ]]; then
          abi_set="$(printf '%s' "$SC_ANDROID_ABIS" | sha256sum | cut -c1-16)"
          key="eas-local-native-v3-android-$RUNNER_OS-$RUNNER_ARCH-$abi_set-$digest"
          printf 'fallback=%s\n' "$full" >> "$GITHUB_OUTPUT"
        fi
        printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"

    # A preview can use the full store ABI set, but a store build must never restore a preview.
    - name: Restore the native artifacts
      id: restore
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/streetcryptid/native/${{ inputs.platform }}
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.fallback }}

    - name: Restore and save the native artifacts
      id: restore-and-save
      if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/streetcryptid/native/${{ inputs.platform }}
        key: ${{ steps.identity.outputs.key }}

    - name: Verify the restored native artifacts
      id: verify
      shell: bash
      env:
        EAS_BUILD_PLATFORM: ${{ inputs.platform }}
      run: |
        ready=false
        if bash scripts/eas-build-pre-install.sh --cache-ready; then
          ready=true
        fi
        printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
