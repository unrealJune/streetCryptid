name: EAS local build Rust cache
description: >-
  Pin the Cargo environment used by `eas build --local` and restore the matching
  Swatinem/rust-cache entry.

# Every job that compiles modules/iroh-location/rust for a mobile target MUST go through this
# action, because rust-cache derives its key from state that is invisible in the workflow file:
#
#   restore key = v0-rust-<shared-key>-<os>-<arch>-<hash of rustc version + CARGO*/CC*/CFLAGS*/
#                 CXX*/CMAKE*/RUST* environment variables>
#   cache key   = <restore key>-<hash of Cargo.lock/Cargo.toml>
#
# Two consequences:
#
#   1. Never feed a source-file hash into `key`/`shared-key`. It lands in the *restore* prefix,
#      so every edit under modules/iroh-location/rust/src invalidates the whole ~1.5 GB cargo
#      cache instead of just recompiling the crates that changed.
#   2. CARGO_TARGET_DIR and RUSTUP_TOOLCHAIN are hashed by value. If the PR build job and the
#      main-branch warm job set them differently -- or one of them sets them at all and the other
#      does not -- the keys silently diverge and every restore misses forever. That is why this
#      action, not the caller, exports them.
#
# The rustc version is hashed too, and scripts/eas-build-pre-install.sh tracks `stable`, so the
# first pull request opened after a new Rust stable release misses until main is warmed again.
inputs:
  platform:
    description: Mobile platform the Cargo target directory is being warmed for (ios or android).
    required: true
  save:
    description: >-
      Whether to write the cache. Only the main-branch warm jobs should set this: caches saved
      from a pull_request run land in that PR's refs/pull/<n>/merge scope, where no other PR can
      read them, and they evict main's shared caches from the repository's 10 GB budget.
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: Whether the Cargo registry/target cache was an exact hit.
    value: ${{ steps.cargo-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Pin the Cargo environment
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.platform }}" in
          ios | android) ;;
          *)
            echo "Unsupported platform: ${{ inputs.platform }}" >&2
            exit 1
            ;;
        esac
        # scripts/eas-build-pre-install.sh runs from the copy EAS makes under runner.temp, so the
        # target directory has to be an absolute path back into the cached workspace checkout.
        {
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/modules/iroh-location/rust/target"
          echo "RUSTUP_TOOLCHAIN=stable"
        } >> "$GITHUB_ENV"

    - name: Install the Rust toolchain
      shell: bash
      run: rustup toolchain install stable --profile minimal --no-self-update

    - name: Restore the Cargo cache
      id: cargo-cache
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: modules/iroh-location/rust -> target
        # shared-key (unlike key) also drops the job id from the prefix, so the warm job and the
        # build job share one entry.
        shared-key: eas-local-${{ inputs.platform }}
        # Deliberately not cache-workspace-crates: `eas build --local` runs the pre-install hook
        # from its own copy of the repository under runner.temp, so the workspace crates compile
        # under a different manifest path than in the warm job. Cargo folds that path into the
        # crate's -C metadata, so those artifacts are always recompiled and would only bloat the
        # tarball. Registry dependencies -- the expensive part -- are keyed on the CARGO_HOME
        # path, which is identical in both jobs, so they do get reused.
        # rust-cache's post step is `success() || env.CACHE_ON_FAILURE == 'true'`; without this a
        # build that fails after 40 minutes of compiling saves nothing.
        cache-on-failure: 'true'
        save-if: ${{ inputs.save }}
