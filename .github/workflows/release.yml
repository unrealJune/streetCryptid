name: Release

# Every push to `main` that passes CI and carries a releasable commit cuts a version, builds both
# store archives on GitHub-hosted runners with `eas build --local`, and uploads them to the stores
# from the same runner (iOS -> TestFlight via fastlane pilot, Android -> Google Play internal track
# via the Play Developer API).
#
# Expo's role is limited to the build: no cloud build quota is used, and since submission moved off
# `eas submit`, no app binary and no store credential passes through Expo at all. The store
# credentials live in this repository's `production-release` environment.

on:
  # Gated on CI rather than on `push` directly: a release that ships a commit whose tests are red is
  # far more expensive to undo than one that ships a few minutes late. `workflow_run` also always
  # runs the copy of this file on the default branch, so a release cannot be redefined from a
  # feature branch.
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to cut. `auto` follows the Conventional Commits since the last tag.
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: read

concurrency:
  # Releases move a tag and a commit on main, so they must never overlap, and a queued release
  # must not be thrown away.
  group: release
  cancel-in-progress: false

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EAS_CLI_VERSION: 21.0.3

jobs:
  version:
    name: Resolve the release version
    # A green CI run on a push to main is the only automatic trigger; a red or cancelled run, or a
    # CI run for a pull request that merely targets main, must not ship anything.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      bump: ${{ steps.resolve.outputs.bump }}
      sha: ${{ steps.publish.outputs.sha }}
      what_to_test: ${{ steps.notes.outputs.what_to_test }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `workflow_run` checks out the default branch by default, but only by name; being
          # explicit keeps the manual and automatic paths identical.
          ref: main
          # next-version.sh resolves the previous release from the tag graph.
          fetch-depth: 0
          # This job is the only one that writes to the repository. RELEASE_TOKEN is only needed
          # when a branch protection rule refuses pushes authenticated with GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          persist-credentials: true

      - name: Check that main still points at the tested commit
        id: gate
        env:
          # Empty for workflow_dispatch, which releases whatever main currently is.
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          subject="$(git log -1 --format=%s)"
          resolved="$(bash scripts/next-version.sh)"
          unreleased="$(sed -n 's/^unreleased=//p' <<<"$resolved")"
          proceed=true
          reason=''
          if [[ -n "$TESTED_SHA" && "$head_sha" != "$TESTED_SHA" ]]; then
            proceed=false
            reason="main moved to $head_sha after CI passed on $TESTED_SHA; the newer commit's own CI run will release it."
          elif [[ -n "$unreleased" && "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ]]; then
            # An earlier run committed a version bump and never tagged it (v3.0.0, 2026-11-10: the
            # tag push was refused after main took the commit). Which version ships next is then a
            # human's call, so this fails -- visibly, on main -- rather than ship it on whatever
            # push comes next, and a dispatch picks it up from here.
            previous_tag="$(sed -n 's/^previous_tag=//p' <<<"$resolved")"
            if [[ "$(sed -n 's/^release=//p' <<<"$resolved")" == 'true' ]]; then
              auto="ships $(sed -n 's/^tag=//p' <<<"$resolved") ($(sed -n 's/^bump=//p' <<<"$resolved") from the commits since $previous_tag)"
            else
              auto="ships nothing (only housekeeping since $previous_tag)"
            fi
            message="app.json declares $unreleased, but the last release tag is $previous_tag: an earlier run committed that bump and never tagged it, so nothing was built. Run this workflow by hand to choose what ships: bump=auto $auto, or patch/minor/major bumps from $previous_tag instead."
            printf '::error title=Unfinished release::%s\n' "$message"
            printf '%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif [[ -z "$unreleased" && "$subject" == 'chore(release):'* ]]; then
            # Pushes made with GITHUB_TOKEN start no workflow runs at all, but a RELEASE_TOKEN push
            # does; this stops the loop. A bump commit whose tag never landed is not skipped: a
            # dispatch on it resumes the release.
            proceed=false
            reason="HEAD is this workflow's own bump commit."
          fi
          printf 'proceed=%s\n' "$proceed" >> "$GITHUB_OUTPUT"
          if [[ "$proceed" != "true" ]]; then
            printf 'Skipping the release: %s\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve the next version
        id: resolve
        if: steps.gate.outputs.proceed == 'true'
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: bash scripts/next-version.sh --force "$BUMP" >> "$GITHUB_OUTPUT"

      - name: Report the decision
        if: steps.gate.outputs.proceed == 'true'
        env:
          RELEASE: ${{ steps.resolve.outputs.release }}
          BUMP: ${{ steps.resolve.outputs.bump }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.resolve.outputs.previous_tag }}
        run: |
          if [[ "$RELEASE" == "true" ]]; then
            printf 'Releasing %s (%s) from %s.\n' "$TAG" "$BUMP" "${PREVIOUS_TAG:-the initial commit}"
          else
            printf 'Only housekeeping commits since %s; skipping the release.\n' "$PREVIOUS_TAG"
          fi >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the TestFlight release notes
        id: notes
        if: steps.resolve.outputs.release == 'true'
        env:
          PREVIOUS_TAG: ${{ steps.resolve.outputs.previous_tag }}
        run: |
          set -euo pipefail
          delimiter="what-to-test-$RANDOM$RANDOM"
          # A resumed release's range holds the unfinished run's own bump commit; testers do not
          # need it.
          if [[ -n "$PREVIOUS_TAG" ]]; then
            subjects="$(git log --no-merges --invert-grep --grep='^chore(release):' --format='- %s' "$PREVIOUS_TAG..HEAD")"
          else
            subjects="$(git log --no-merges --format='- %s' --max-count=20 HEAD)"
          fi
          {
            printf '%s<<%s\n' what_to_test "$delimiter"
            # App Store Connect caps "What to Test", and a line equal to the delimiter would break
            # out of the heredoc.
            grep -v -x -F "$delimiter" <<<"$subjects" | cut -c 1-200 | head -c 3500
            printf '\n%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and tag the release
        id: publish
        if: steps.resolve.outputs.release == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/apply-version.sh "$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.json package.json
          # The very first release ships the version already in app.json, so there is nothing to
          # commit -- only to tag.
          if git diff --cached --quiet; then
            echo "app.json already declares $VERSION; tagging without a bump commit."
          else
            git commit --message "chore(release): $TAG"
          fi
          git tag --annotate "$TAG" --message "$TAG"
          # The branch has to land before the tag: if someone pushed to main mid-run this fails
          # here, leaving no dangling tag behind.
          git push origin HEAD:main
          # The tag push can still be refused after main took the commit -- it was for v3.0.0 on
          # 2026-11-10 ("remote rejected ... (failed)", no rule in the way) -- which leaves main
          # declaring a version that was never built. Retry, and if it still does not land, say
          # how to finish: the next automatic run stops at the gate until someone does.
          for attempt in 1 2 3 4 5; do
            if git push origin "$TAG"; then
              break
            fi
            if ((attempt == 5)); then
              printf '::error title=Tag push failed::main now declares %s, but %s could not be pushed, so nothing was built. Run this workflow by hand (bump=auto) to tag and ship it.\n' "$VERSION" "$TAG"
              exit 1
            fi
            sleep $((attempt * 15))
          done
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release_ios:
    name: Build and submit iOS to TestFlight
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: xcode-27
    timeout-minutes: 120
    environment: production-release
    permissions:
      contents: read
    outputs:
      submission_url: ${{ steps.release.outputs.submission_url }}
    env:
      EAS_BUILD_GIT_COMMIT_HASH: ${{ needs.version.outputs.sha }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: '0'
      EXPO_NO_KEYCHAIN: '1'
    steps:
      # Checked before a 40-minute build rather than after it: a release that builds and then
      # cannot be delivered has burned a tag for nothing.
      - name: Require the build and App Store Connect credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in EXPO_TOKEN ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            echo "The production-release environment is missing: ${missing[*]}" >&2
            exit 1
          fi

      - name: Configure isolated build paths
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "BUILD_ARTIFACT=$RUNNER_TEMP/streetcryptid-$VERSION.ipa"
            echo "EAS_LOCAL_BUILD_ARTIFACTS_DIR=$RUNNER_TEMP/eas-artifacts-ios"
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-local-build-ios"
          } >> "$GITHUB_ENV"

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      # Restore-only for the Bun and Cargo entries: cache-warm.yml owns those on main. This is the
      # only workflow that runs `eas build --local` on main, so it is also the only one that can
      # fill the pod download cache for every pull request to restore.
      - name: Prepare the runner
        id: setup
        uses: ./.github/actions/eas-local-build-setup
        with:
          platform: ios
          eas-cli-version: ${{ env.EAS_CLI_VERSION }}

      - name: Verify CI output isolation
        run: |
          set -euo pipefail
          bash scripts/test-eas-ci-log-isolation.sh
          bash scripts/test-build-profile-isolation.sh

      - name: Build the store archive locally
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR" "$EAS_LOCAL_BUILD_WORKINGDIR"
          bash scripts/eas-local-build-ci.sh \
            ios \
            production \
            "$BUILD_ARTIFACT" \
            production-release

      # Profiled on the same terms as a pull-request build. This is the run whose numbers matter
      # most for comparison: it is the only one that builds every ABI and a real store archive.
      - name: Report the build profile
        if: '!cancelled()'
        env:
          SC_BUILD_SECONDS: ${{ steps.build.outputs.build_seconds }}
          SC_CACHE_JS_HIT: ${{ steps.setup.outputs.js-cache-hit }}
          SC_CACHE_CARGO_HIT: ${{ steps.setup.outputs.cargo-cache-hit }}
          SC_CACHE_NATIVE_HIT: ${{ steps.setup.outputs.artifact-cache-hit }}
          SC_CACHE_PODS_HIT: ${{ steps.setup.outputs.native-cache-hit }}
        run: |
          bash scripts/build-report.sh ios >> "$GITHUB_STEP_SUMMARY" ||
            printf '_The build profile could not be rendered._\n' >> "$GITHUB_STEP_SUMMARY"

      # Straight from this runner to App Store Connect -- the .ipa never goes to Expo.
      - name: Upload to TestFlight
        id: release
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          SC_WHAT_TO_TEST: ${{ needs.version.outputs.what_to_test }}
        run: bash scripts/submit-testflight.sh "$BUILD_ARTIFACT"

      # Saved here on main, where every pull request's restore can fall back to it.
      # The hit rate is the whole point of the ccache, so it goes in the summary. ccache's stats name
      # nothing but its own counters and cache directory.
      - name: Report ccache statistics
        if: '!cancelled()'
        run: |
          {
            printf '### ccache\n\n```\n'
            ccache --show-stats 2>&1 || true
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the ccache
        if: "!cancelled() && steps.setup.outputs.ccache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ${{ steps.setup.outputs.ccache-key }}

      # Only what this build's bundle used (see eas-local-build-setup), so the entry does not grow.
      # actions/cache folds the path into an entry's identity, so the output is moved to the path
      # the restore reads from; saved from the output directory itself, no restore ever matched.
      - name: Stage the Metro transform cache
        if: "!cancelled() && steps.setup.outputs.metro-cache-hit != 'true'"
        run: |
          set -euo pipefail
          # Absent when setup failed before pointing Metro at them; there is nothing to save.
          [[ -d "${EXPO_METRO_CACHE_OUTPUT_DIR:-}" ]] || exit 0
          rm -rf -- "$EXPO_METRO_CACHE_RESTORE_DIR"
          mv -- "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"

      - name: Save the Metro transform cache
        if: "!cancelled() && steps.setup.outputs.metro-cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/metro-cache
          key: ${{ steps.setup.outputs.metro-cache-key }}

      - name: Save CocoaPods download cache
        if: "!cancelled() && steps.setup.outputs.native-cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.setup.outputs.native-cache-key }}

      # This one runs on main, so unlike the pull-request copy of this step its entry is readable
      # by every open pull request -- the same reason cache-warm.yml exists.
      - name: Save the prebuilt native artifacts
        if: "!cancelled() && steps.setup.outputs.artifact-cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/streetcryptid/native/ios
          key: ${{ steps.setup.outputs.artifact-cache-key }}

      - name: Remove local build state
        if: always()
        run: |
          set -euo pipefail
          for path in \
            "${EAS_LOCAL_BUILD_ARTIFACTS_DIR:-}" \
            "${EAS_LOCAL_BUILD_WORKINGDIR:-}"; do
            if [[ -z "$path" ]]; then
              continue
            fi
            if [[ "$path" != "$RUNNER_TEMP/"* ]]; then
              echo "Refusing to clean unexpected path: $path" >&2
              exit 1
            fi
            if [[ -d "$path" ]]; then
              find "$path" -depth -delete
            fi
          done
          # The submitters delete their own work directories -- holding the decoded store key --
          # through an exit trap. This covers the one case a trap cannot: a hard kill.
          for path in "$RUNNER_TEMP"/testflight.* "$RUNNER_TEMP"/play.*; do
            if [[ -d "$path" ]]; then
              find "$path" -depth -delete
            fi
          done
          if [[ -n "${BUILD_ARTIFACT:-}" ]]; then
            rm -f -- "$BUILD_ARTIFACT"
          fi

  release_android:
    name: Build and submit Android to Google Play
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production-release
    permissions:
      contents: read
    outputs:
      submission_url: ${{ steps.release.outputs.submission_url }}
    env:
      EAS_BUILD_GIT_COMMIT_HASH: ${{ needs.version.outputs.sha }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: '0'
      # No SC_ANDROID_ABIS and no reactNativeArchitectures override here: a store bundle ships every
      # ABI. Only the Gradle settings are shared with the pull-request builds, and this job is where
      # ~/.gradle/caches/build-cache-1 is filled for a ref every pull request can read.
      GRADLE_OPTS: >-
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.jvmargs=-Xmx5g
    steps:
      # Checked before a 40-minute build rather than after it: a release that builds and then
      # cannot be delivered has burned a tag for nothing.
      - name: Require the build and Google Play credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in EXPO_TOKEN PLAY_SERVICE_ACCOUNT_JSON_BASE64; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]})); then
            echo "The production-release environment is missing: ${missing[*]}" >&2
            exit 1
          fi

      - name: Configure isolated build paths
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "BUILD_ARTIFACT=$RUNNER_TEMP/streetcryptid-$VERSION.aab"
            echo "EAS_LOCAL_BUILD_ARTIFACTS_DIR=$RUNNER_TEMP/eas-artifacts-android"
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-local-build-android"
          } >> "$GITHUB_ENV"

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      # Restore-only for the Bun and Cargo entries: cache-warm.yml owns those on main. This is the
      # only workflow that runs `eas build --local` on main, so it is also the only one that can
      # fill the Gradle dependency cache for every pull request to restore.
      - name: Prepare the runner
        id: setup
        uses: ./.github/actions/eas-local-build-setup
        with:
          platform: android
          eas-cli-version: ${{ env.EAS_CLI_VERSION }}

      - name: Verify CI output isolation
        run: |
          set -euo pipefail
          bash scripts/test-eas-ci-log-isolation.sh
          bash scripts/test-build-profile-isolation.sh

      # Every store build since the SDK 58 merge died with "The runner has received a shutdown
      # signal" 10-32 minutes in, while the arm64-only pull-request builds of the same commits
      # passed. Three ABIs means three sets of CMake builds side by side under Gradle's parallel
      # workers, on a 16 GB runner already giving Gradle 5 GB; the runner's own resource lines in the
      # build step (scripts/build-profile.sh) say whether memory is what ran out -- they did, with
      # available memory under 250 MB and the image's 3 GB of swap full. Swap turns a short compile
      # peak into slowness instead of a dead runner. It used to go only on the ephemeral /mnt disk,
      # which the ubuntu-24.04 image no longer mounts, so it was skipped on every run; the root disk
      # has room for it (~89 GB free after the setup action prunes it, ~12 GB used by the build).
      # Best effort: a release is not failed for want of swap.
      - name: Add swap for the three-ABI native build
        run: |
          set -euo pipefail
          swap_gb=12
          headroom_gb=30
          dir=/
          if mountpoint -q /mnt; then
            dir=/mnt
          fi
          swapfile="${dir%/}/sc-build.swap"
          avail_gb=$(($(df --output=avail -k "$dir" | tail -n 1) / 1024 / 1024))
          if ((avail_gb < swap_gb + headroom_gb)); then
            echo "::warning::Only ${avail_gb} GB free on $dir; building without extra swap."
            exit 0
          fi
          if sudo fallocate -l "${swap_gb}G" "$swapfile" &&
            sudo chmod 600 "$swapfile" &&
            sudo mkswap "$swapfile" > /dev/null &&
            sudo swapon "$swapfile"; then
            swapon --show
            free -m
          else
            echo "::warning::Could not enable swap at $swapfile; building without it."
            sudo swapoff "$swapfile" 2> /dev/null || true
            sudo rm -f "$swapfile"
          fi

      - name: Build the store bundle locally
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR" "$EAS_LOCAL_BUILD_WORKINGDIR"
          bash scripts/eas-local-build-ci.sh \
            android \
            production \
            "$BUILD_ARTIFACT" \
            production-release

      # Profiled on the same terms as a pull-request build. This is the run whose numbers matter
      # most for comparison: it is the only one that builds every ABI and a real store bundle.
      - name: Report the build profile
        if: '!cancelled()'
        env:
          SC_BUILD_SECONDS: ${{ steps.build.outputs.build_seconds }}
          SC_CACHE_JS_HIT: ${{ steps.setup.outputs.js-cache-hit }}
          SC_CACHE_CARGO_HIT: ${{ steps.setup.outputs.cargo-cache-hit }}
          SC_CACHE_NATIVE_HIT: ${{ steps.setup.outputs.artifact-cache-hit }}
          SC_CACHE_GRADLE_HIT: ${{ steps.setup.outputs.native-cache-hit }}
        run: |
          bash scripts/build-report.sh android >> "$GITHUB_STEP_SUMMARY" ||
            printf '_The build profile could not be rendered._\n' >> "$GITHUB_STEP_SUMMARY"

      # Straight from this runner to the Play Developer API -- the .aab never goes to Expo.
      - name: Upload to the Google Play internal track
        id: release
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          SC_WHAT_TO_TEST: ${{ needs.version.outputs.what_to_test }}
        run: bash scripts/submit-play.sh "$BUILD_ARTIFACT"

      - name: Report ccache statistics
        if: '!cancelled()'
        run: |
          {
            printf '### ccache\n\n```\n'
            ccache --show-stats --verbose 2>&1 || true
            printf '```\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the ccache
        if: "!cancelled() && steps.setup.outputs.ccache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ${{ steps.setup.outputs.ccache-key }}

      # Only what this build's bundle used (see eas-local-build-setup), so the entry does not grow.
      # actions/cache folds the path into an entry's identity, so the output is moved to the path
      # the restore reads from; saved from the output directory itself, no restore ever matched.
      - name: Stage the Metro transform cache
        if: "!cancelled() && steps.setup.outputs.metro-cache-hit != 'true'"
        run: |
          set -euo pipefail
          # Absent when setup failed before pointing Metro at them; there is nothing to save.
          [[ -d "${EXPO_METRO_CACHE_OUTPUT_DIR:-}" ]] || exit 0
          rm -rf -- "$EXPO_METRO_CACHE_RESTORE_DIR"
          mv -- "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"

      - name: Save the Metro transform cache
        if: "!cancelled() && steps.setup.outputs.metro-cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/metro-cache
          key: ${{ steps.setup.outputs.metro-cache-key }}

      - name: Save Gradle dependency and build caches
        if: "!cancelled() && steps.setup.outputs.native-cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
            ~/.gradle/wrapper
          key: ${{ steps.setup.outputs.native-cache-key }}

      # Every run, unlike the entry above: see "Restore the Gradle build cache" for why.
      - name: Save the Gradle build cache
        if: '!cancelled()'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ steps.setup.outputs.gradle-build-cache-key }}

      # This one runs on main, so unlike the pull-request copy of this step its entry is readable
      # by every open pull request -- the same reason cache-warm.yml exists.
      - name: Save the prebuilt native artifacts
        if: "!cancelled() && steps.setup.outputs.artifact-cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/streetcryptid/native/android
          key: ${{ steps.setup.outputs.artifact-cache-key }}

      - name: Remove local build state
        if: always()
        run: |
          set -euo pipefail
          for path in \
            "${EAS_LOCAL_BUILD_ARTIFACTS_DIR:-}" \
            "${EAS_LOCAL_BUILD_WORKINGDIR:-}"; do
            if [[ -z "$path" ]]; then
              continue
            fi
            if [[ "$path" != "$RUNNER_TEMP/"* ]]; then
              echo "Refusing to clean unexpected path: $path" >&2
              exit 1
            fi
            if [[ -d "$path" ]]; then
              find "$path" -depth -delete
            fi
          done
          # The submitters delete their own work directories -- holding the decoded store key --
          # through an exit trap. This covers the one case a trap cannot: a hard kill.
          for path in "$RUNNER_TEMP"/testflight.* "$RUNNER_TEMP"/play.*; do
            if [[ -d "$path" ]]; then
              find "$path" -depth -delete
            fi
          done
          if [[ -n "${BUILD_ARTIFACT:-}" ]]; then
            rm -f -- "$BUILD_ARTIFACT"
          fi

  publish:
    name: Publish the GitHub release
    # The tag exists as soon as the version job pushes it, so the release notes are published even
    # when one store submission fails; the summary records which half shipped. A version job that
    # failed may not have pushed the tag at all, and then there is nothing to publish.
    if: always() && needs.version.result == 'success' && needs.version.outputs.release == 'true'
    needs:
      - version
      - release_ios
      - release_android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      IOS_RESULT: ${{ needs.release_ios.result }}
      IOS_URL: ${{ needs.release_ios.outputs.submission_url }}
      ANDROID_RESULT: ${{ needs.release_android.result }}
      ANDROID_URL: ${{ needs.release_android.outputs.submission_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes

      - name: Summarize the submissions
        run: |
          set -euo pipefail

          platform_line() {
            local platform="$1" store="$2" result="$3" url="$4"
            if [[ "$result" != "success" ]]; then
              printf -- '- **%s:** submission failed — [view GitHub Actions logs](%s)\n' "$platform" "$RUN_URL"
            elif [[ -n "$url" ]]; then
              printf -- '- **%s:** submitted to %s — [submission details](%s)\n' "$platform" "$store" "$url"
            else
              printf -- '- **%s:** submitted to %s\n' "$platform" "$store"
            fi
          }

          {
            printf '### %s\n\n' "$TAG"
            platform_line "iOS" "TestFlight" "$IOS_RESULT" "$IOS_URL"
            platform_line "Android" "the Google Play internal track" "$ANDROID_RESULT" "$ANDROID_URL"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$IOS_RESULT" != "success" || "$ANDROID_RESULT" != "success" ]]; then
            echo "At least one store submission failed." >&2
            exit 1
          fi
