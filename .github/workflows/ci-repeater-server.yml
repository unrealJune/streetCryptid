name: CI / repeater server

# The hosted stash and the Linux repeater daemon (`repeater/server`, crate `trail-stash`) and the
# roster/wire crate it shares with the phone (`repeater/protocol`). Called only from `ci.yml`.
#
# Both crates are members of the root Cargo workspace, which also holds the phone's crates. Every
# cargo command here names its packages: `--workspace` would build the phone too, and features on
# a workspace-wide build would unify across all of it.

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml selects the version; this installs it with rustfmt.
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends protobuf-compiler

      - name: Restore Rust compilation cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target
          key: repeater-server
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Every crate in the workspace, the phone's included: one rustfmt.toml covers them all.
      - name: cargo fmt
        run: cargo fmt --all --check

      # The default build is the pure core: no iroh, no tokio. It is what the release gates on.
      - name: cargo test (pure core)
        run: cargo test --locked -p streetcryptid-repeater -p trail-stash

      # `-p`, never `--workspace`, with features: resolver 2 unifies features across everything in
      # one invocation, so a workspace-wide build would test the pure core with iroh compiled in.
      - name: cargo test (live node + repeater)
        run: cargo test --locked -p trail-stash --features live -- --test-threads=4

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: helm lint
        run: helm lint --strict repeater/server/charts/trail-stash

  image:
    name: Image build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The same build the release publishes, never pushed. Reads the release's layer cache and
      # writes none, so a pull request cannot seed what main ships.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: repeater/server/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=trail-stash
