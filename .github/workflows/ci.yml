name: CI

# One entry point, a lane per product (docs/MONOREPO.md, "CI"). A path-filtered workflow that does
# not run leaves a required check pending forever, and `release.yml`'s `workflow_run` keys on the
# name `CI`, so this workflow always runs, asks `scripts/ci-changes.sh` which lanes the change
# needs, and calls only those. `Required` passes a lane that was skipped and fails one that broke.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.lanes.outputs.app }}
      server: ${{ steps.lanes.outputs.server }}
      windows: ${{ steps.lanes.outputs.windows }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test lane selection
        run: bash scripts/test-ci-changes.sh

      - name: Select lanes
        id: lanes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          bash scripts/ci-changes.sh "$BASE_SHA" HEAD | tee -a "$GITHUB_OUTPUT"

  app:
    name: App
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # `native` pushes refreshed UniFFI bindings back to the pull request branch.
    permissions:
      contents: write
    uses: ./.github/workflows/ci-app.yml

  server:
    name: Repeater server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    uses: ./.github/workflows/ci-repeater-server.yml

  windows:
    name: Repeater windows
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/ci-repeater-windows.yml

  required:
    name: Required
    if: always()
    needs:
      - changes
      - app
      - server
      - windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required lanes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_RESULT: ${{ needs.app.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          # Without a lane decision nothing below it means anything.
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Lane selection did not succeed." >&2
            exit 1
          fi
          for result in "$APP_RESULT" "$SERVER_RESULT" "$WINDOWS_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A required CI lane did not succeed." >&2
              exit 1
            fi
          done
