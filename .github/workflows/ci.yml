name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  quality:
    name: Quality / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            script: lint
          - name: Format
            script: format:check
          # Guards the one invariant a comment could not: a store build ships no developer
          # telemetry. See scripts/check-release-telemetry.mjs.
          - name: Release telemetry
            script: check:release-telemetry
          - name: Jest
            script: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: bun run "${{ matrix.script }}"

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore generated WASM bindings
        id: wasm-bindings
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: modules/iroh-location/web
          # Must stay byte-identical to the key in copilot-setup-steps.yml so the two workflows
          # share one entry instead of each rebuilding the bindings.
          key: wasm-output-${{ runner.os }}-rust-1.97.0-wasm-pack-0.15.0-binaryen-117-${{ hashFiles('modules/iroh-location/rust-wasm/Cargo.lock', 'modules/iroh-location/rust-wasm/Cargo.toml', 'modules/iroh-location/rust-wasm/src/**/*.rs', 'modules/iroh-location/rust/Cargo.lock', 'modules/iroh-location/rust/Cargo.toml', 'modules/iroh-location/rust/src/**/*.rs', 'justfile') }}

      - name: Install Linux build dependencies
        if: steps.wasm-bindings.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake libssl-dev perl pkg-config

      - name: Install Rust and WASM build tools
        if: steps.wasm-bindings.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: |
            rust@1.97.0+wasm32-unknown-unknown
            just@1.57.0
            wasm-pack@0.15.0
          fallback: none

      - name: Restore WASM compilation cache
        if: steps.wasm-bindings.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: modules/iroh-location/rust-wasm -> target
          key: wasm
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install Binaryen
        if: steps.wasm-bindings.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/binaryen.tar.gz \
            https://github.com/WebAssembly/binaryen/releases/download/version_117/binaryen-version_117-x86_64-linux.tar.gz
          echo "3dc677006555b355ea2da5e82602065a161d5e83eaefd3f759afa00b96e83212  /tmp/binaryen.tar.gz" |
            sha256sum --check
          tar --extract --gzip --file /tmp/binaryen.tar.gz --directory /tmp
          sudo install --mode 0755 /tmp/binaryen-version_117/bin/wasm-opt /usr/local/bin/wasm-opt

      - name: Build web bindings
        if: steps.wasm-bindings.outputs.cache-hit != 'true'
        run: just build-wasm

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Generate Expo types
        run: |
          bunx expo customize tsconfig.json
          git diff --exit-code -- .gitignore tsconfig.json

      - name: Run Typecheck
        run: bun run typecheck

  native:
    name: Native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Write access so a Rust API change can push its own refreshed UniFFI bindings back to the
    # pull request branch instead of failing and waiting for a manual `just bindgen-*`.
    permissions:
      contents: write
    steps:
      # Checks out the PR head rather than the default merge commit: this job may commit on top
      # of what it checked out, and a merge commit must never be pushed to the branch. Rust tests
      # and binding generation depend only on the crate, so testing head instead of the merge
      # result loses nothing here (the EAS build workflows already build head.sha too).
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true

      - name: Test EAS CI log isolation
        run: bash scripts/test-eas-ci-log-isolation.sh

      - name: Test release versioning
        run: bash scripts/test-next-version.sh

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake libssl-dev perl pkg-config

      - name: Install Rust build tools
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: |
            rust@1.97.0
            just@1.57.0
          fallback: none

      - name: Restore Rust compilation cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: modules/iroh-location/rust -> target
          key: native
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run Rust tests
        run: just test-rust

      # A change to the Rust UniFFI surface leaves the tracked Kotlin/Swift bindings stale, which
      # used to fail CI until someone ran `just bindgen-android` / `just bindgen-ios` by hand.
      # Regenerate them here and push the result back instead. The generator is deterministic, so
      # what lands on the branch is exactly what a re-run would produce — a GITHUB_TOKEN push not
      # retriggering CI is therefore harmless. The EAS build workflows need no equivalent step:
      # scripts/eas-build-pre-install.sh already regenerates both platforms before building.
      - name: Regenerate UniFFI bindings
        run: bash scripts/generate-uniffi-bindings.sh all

      - name: Detect stale bindings
        id: bindings
        env:
          BINDING_PATHS: >-
            modules/iroh-location/android/src/main/java/uniffi
            modules/iroh-location/ios/generated
        run: |
          set -euo pipefail
          # Compare through the index, not the worktree: a new Rust type can make the generator
          # emit a file that does not exist yet, and `git diff` alone would not see it.
          git add --all -- $BINDING_PATHS
          if git diff --cached --quiet -- $BINDING_PATHS; then
            echo 'stale=false' >> "$GITHUB_OUTPUT"
            echo 'Tracked UniFFI bindings match the Rust API.'
          else
            echo 'stale=true' >> "$GITHUB_OUTPUT"
            git --no-pager diff --cached --stat -- $BINDING_PATHS
          fi

      - name: Push refreshed bindings
        id: push-bindings
        if: >-
          steps.bindings.outputs.stale == 'true'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            --message 'chore(native): refresh generated UniFFI bindings' \
            --message 'Regenerated by CI from the Rust UniFFI surface on this branch.'
          # A non-fast-forward here means the branch already moved on, and the run for that newer
          # commit regenerates from scratch — so failing loudly is the right outcome, not a retry.
          git push origin "HEAD:refs/heads/$HEAD_REF"

      # Fork pull requests get no write access, and main is never auto-committed to. Both keep the
      # old behaviour: fail with the manual instruction. On main this should be unreachable,
      # because the pull request that introduced the drift refreshed it before merging.
      - name: Fail on stale bindings CI cannot refresh
        if: steps.bindings.outputs.stale == 'true' && steps.push-bindings.outcome == 'skipped'
        run: |
          echo 'Tracked UniFFI bindings are stale, and CI cannot push a fix for this event.' >&2
          echo "Run 'just bindgen-android' and 'just bindgen-ios' to refresh them." >&2
          exit 1

  required:
    name: Required
    if: always()
    needs:
      - quality
      - typecheck
      - native
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          for result in "$QUALITY_RESULT" "$TYPECHECK_RESULT" "$NATIVE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job did not succeed." >&2
              exit 1
            fi
          done
