name: CI / website

# streetcrypt.id (`website/`): the static checks, the chart, and the image with a smoke test of the
# paths phones and link verifiers depend on. Called from `ci.yml`, and by `release-website.yml`
# before it publishes anything.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # For Prettier. The app lane does not run on a website-only change, so this lane checks its
      # own formatting.
      - name: Install project dependencies
        uses: ./.github/actions/bun-install
        with:
          save: false

      - name: Prettier
        run: bunx prettier --check website

      - name: Site tests
        run: bun test website/test

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: helm lint
        run: helm lint --strict website/charts/streetcrypt-id

      - name: helm template
        run: helm template streetcrypt-id website/charts/streetcrypt-id > /dev/null

  image:
    name: Image + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `caddy validate` runs inside the build, so a broken Caddyfile fails here.
      - name: Build image
        run: docker build -f website/Dockerfile -t streetcrypt-id:ci website

      # Run it the way the chart does: uid 1000, read-only root, nothing but the two emptyDirs.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name site --user 1000:1000 --read-only \
            --tmpfs /data:uid=1000 --tmpfs /config:uid=1000 \
            -p 8080:8080 streetcrypt-id:ci
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 0.5
          done
          bash website/test/smoke.sh http://localhost:8080 || { docker logs site; exit 1; }
