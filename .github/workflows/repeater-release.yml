name: Repeater prerelease

on:
  push:
    tags: ['repeater-v*']

permissions:
  contents: read

concurrency:
  group: repeater-prerelease
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate separate prerelease namespace
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#repeater-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo 'Only repeater-vMAJOR.MINOR.PATCH-preview.N tags may publish unsigned builds.'
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/repeater-ci.yml
    with:
      version: ${{ needs.version.outputs.value }}
    secrets:
      sign-params: ${{ secrets.REPEATER_SIGN_PARAMS }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: repeater-win-*
          path: releases
          merge-multiple: true
      - name: Publish tested commit and update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" releases/* --verify-tag --prerelease --latest=false \
            --title "streetCryptid repeater ${TAG#repeater-v}" \
            --notes "Unsigned Windows preview. x64 and ARM64 artifacts built and tested from $COMMIT. Identity and ownership remain outside the installation directory."
          if ! gh release view repeater-preview >/dev/null 2>&1; then
            gh release create repeater-preview --target "$COMMIT" --prerelease --latest=false \
              --title 'streetCryptid repeater update feed' \
              --notes 'Unsigned preview update feed. Versioned repeater releases retain source provenance.'
          fi
          # Publish packages before the manifests that make clients request them.
          find releases -type f ! -name '*.json' -print0 | xargs -0 gh release upload repeater-preview --clobber
          find releases -type f -name '*.json' -print0 | xargs -0 gh release upload repeater-preview --clobber
