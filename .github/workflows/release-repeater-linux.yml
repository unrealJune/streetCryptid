name: Release / repeater linux

# Cuts the Linux repeater's releases: `streetcryptid-repeater` tarballs for x86_64 and aarch64,
# their source archive and checksums, on a `linux-vX.Y.Z` GitHub release.
#
# A push to main that touches what the binary is built from resolves the next version with
# scripts/next-repeater-version.sh linux (the app's Conventional Commit rules,
# scripts/lib/conventional-commits.sh). When there is one, the same build gates CI runs build that
# exact commit, and only then is the tag created, together with its GitHub release. A push with
# nothing releasable builds nothing here: CI's Linux lane already tested it.
#
# A `linux-v*` tag pushed by hand publishes that version on its own, and the workflow's dispatch
# can force a bump. The tag this workflow creates does not start it again: GITHUB_TOKEN pushes
# never trigger workflows.

on:
  push:
    branches:
      - main
    paths:
      - repeater/linux/**
      - repeater/host/**
      - repeater/server/src/**
      - repeater/server/Cargo.toml
      - repeater/protocol/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - third_party/**
      - .github/workflows/ci-repeater-linux.yml
      - .github/workflows/release-repeater-linux.yml
    tags:
      - linux-v*
  workflow_dispatch:
    inputs:
      bump:
        description: Release to cut. `auto` follows the Conventional Commits since the last Linux tag.
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: read

concurrency:
  # A release creates a tag; never overlap, never drop a queued one.
  group: release-repeater-linux
  cancel-in-progress: false

jobs:
  version:
    name: Resolve the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.ver.outputs.release }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      create_tag: ${{ steps.ver.outputs.create_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release
        id: ver
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#linux-v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo 'Linux tags are linux-vMAJOR.MINOR.PATCH[-PRERELEASE].' >&2
              exit 1
            fi
            release=true
            tag="$GITHUB_REF_NAME"
            create_tag=false
          else
            out="$(bash scripts/next-repeater-version.sh linux --force "$BUMP")"
            echo "$out"
            release="$(sed -n 's/^release=//p' <<<"$out")"
            version="$(sed -n 's/^version=//p' <<<"$out")"
            tag="$(sed -n 's/^tag=//p' <<<"$out")"
            # Releases are cut from main only.
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              release=false
            fi
            create_tag="$release"
          fi
          {
            echo "release=${release}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "create_tag=${create_tag}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Linux repeater"
            if [[ "$release" == "true" ]]; then
              echo "Release **${tag}** at \`${GITHUB_SHA::7}\`."
            else
              echo "No release: nothing since the last Linux tag that ships."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci-repeater-linux.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: repeater-linux-*
          path: dist
          merge-multiple: true
      - name: Publish the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          CREATE_TAG: ${{ needs.version.outputs.create_tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # One source archive is enough: both architectures archived the same commit.
          rm -f dist/*-source-aarch64.tar.gz
          mv dist/*-source-x86_64.tar.gz "dist/streetcryptid-repeater-${VERSION}-source.tar.gz"
          (cd dist && sha256sum ./*.tar.gz | sed 's# \./# #' > SHA256SUMS && rm -f SHA256SUMS-*)
          if [[ "$CREATE_TAG" == "true" ]]; then
            target=(--target "$COMMIT")
          else
            target=(--verify-tag)
          fi
          gh release create "$TAG" dist/* "${target[@]}" --prerelease --latest=false \
            --title "streetCryptid Linux repeater $VERSION" \
            --notes "The Linux repeater: one binary for the CLI and the opt-in systemd daemon, for x86_64 and aarch64 (glibc 2.35+), built and tested from $COMMIT. Unpack, then \`./streetcryptid-repeater run\` or \`install\`; see README.md. Check downloads against SHA256SUMS."
