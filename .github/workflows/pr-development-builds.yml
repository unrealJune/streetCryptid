name: PR standalone Release builds

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: pr-development-builds-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EAS_CLI_VERSION: 21.0.3
  # Registered only so GitHub redacts the tailnet name that the Tailscale action
  # prints while configuring MagicDNS on the macOS runner. Not a credential.
  TS_TAILNET: ${{ secrets.TS_TAILNET }}

jobs:
  build_ios:
    name: Build and upload iOS Release
    if: >-
      ${{github.event.pull_request.head.repo.full_name == github.repository}}
    runs-on: macos-latest
    timeout-minutes: 90
    environment: development-builds
    permissions:
      contents: read
    # Non-secret install PATH (/get/<id>) handed to the notify job, which
    # rebuilds the full URL. The full URL can't be a job output — it contains the
    # secret base URL, which GitHub scrubs from cross-job outputs.
    outputs:
      install_path: ${{ steps.upload.outputs.install_path }}
    env:
      EAS_BUILD_GIT_COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: '0'
      EXPO_NO_KEYCHAIN: '1'
    steps:
      - name: Require Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "The development-builds environment is missing EXPO_TOKEN." >&2
            exit 1
          fi

      - name: Configure isolated build paths
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "BUILD_ARTIFACT=$RUNNER_TEMP/streetcryptid-pr-$PR_NUMBER.ipa"
            echo "EAS_LOCAL_BUILD_ARTIFACTS_DIR=$RUNNER_TEMP/eas-artifacts-ios"
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-local-build-ios"
          } >> "$GITHUB_ENV"

      - name: Check out PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Restore-only for the Bun and Cargo entries: cache-warm.yml populates those on main, where
      # every pull request can read them. The CocoaPods cache is filled by `eas build --local`,
      # which runs here and on main during a release.
      - name: Prepare the runner
        id: setup
        uses: ./.github/actions/eas-local-build-setup
        with:
          platform: ios
          eas-cli-version: ${{ env.EAS_CLI_VERSION }}

      - name: Verify EAS log isolation
        run: bash scripts/test-eas-ci-log-isolation.sh

      - name: Build the standalone Release locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR" "$EAS_LOCAL_BUILD_WORKINGDIR"
          bash scripts/eas-local-build-ci.sh \
            ios \
            production-internal-ios \
            "$BUILD_ARTIFACT"

      # actions/cache's own post step is `post-if: success()`, so a 40-minute build that fails
      # would otherwise discard the pod downloads it just made and leave the retry cold.
      - name: Save CocoaPods download cache
        if: "!cancelled() && steps.setup.outputs.native-cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.setup.outputs.native-cache-key }}

      # Join the tailnet so the internal distribution host is reachable. The
      # ephemeral node is torn down at job end. Nothing prints the tailnet
      # topology (no `tailscale status`), keeping it off the public logs.
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Bland fixed node name so the tailnet admin view shows nothing
          # identifying, and no `tailscale status` is ever run. MagicDNS stays on
          # (the internal host resolves through the tailnet); the tailnet name the
          # action prints while configuring DNS is redacted by the TS_TAILNET
          # secret registered in the top-level env.
          hostname: ci-ephemeral

      - name: Upload the build to the internal distribution server
        id: upload
        env:
          DISTRIBUTOR_BASE_URL: ${{ secrets.DISTRIBUTOR_BASE_URL }}
          DISTRIBUTOR_TOKEN: ${{ secrets.DISTRIBUTOR_TOKEN }}
        run: |
          set -euo pipefail
          # Suppress all output: the install URL and internal host must not reach
          # the public logs. The masked install path is written to $GITHUB_OUTPUT
          # for the notify job to post to Discord.
          if ! bash scripts/upload-build.sh ios "$BUILD_ARTIFACT" >/dev/null 2>&1; then
            echo "Uploading the build to the internal distribution server failed." >&2
            exit 1
          fi

      - name: Remove local build state
        if: always()
        run: |
          set -euo pipefail
          for path in \
            "${EAS_LOCAL_BUILD_ARTIFACTS_DIR:-}" \
            "${EAS_LOCAL_BUILD_WORKINGDIR:-}"; do
            if [[ -z "$path" ]]; then
              continue
            fi
            if [[ "$path" != "$RUNNER_TEMP/"* ]]; then
              echo "Refusing to clean unexpected path: $path" >&2
              exit 1
            fi
            if [[ -d "$path" ]]; then
              find "$path" -depth -delete
            fi
          done
          if [[ -n "${BUILD_ARTIFACT:-}" ]]; then
            rm -f -- "$BUILD_ARTIFACT"
          fi

  build_android:
    name: Build and upload Android Release
    if: >-
      ${{github.event.pull_request.head.repo.full_name == github.repository}}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: development-builds
    permissions:
      contents: read
    # Non-secret install PATH (/get/<id>) handed to the notify job, which
    # rebuilds the full URL. The full URL can't be a job output — it contains the
    # secret base URL, which GitHub scrubs from cross-job outputs.
    outputs:
      install_path: ${{ steps.upload.outputs.install_path }}
    env:
      EAS_BUILD_GIT_COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: '0'
    steps:
      - name: Require Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "The development-builds environment is missing EXPO_TOKEN." >&2
            exit 1
          fi

      - name: Configure isolated build paths
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "BUILD_ARTIFACT=$RUNNER_TEMP/streetcryptid-pr-$PR_NUMBER.apk"
            echo "EAS_LOCAL_BUILD_ARTIFACTS_DIR=$RUNNER_TEMP/eas-artifacts-android"
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-local-build-android"
          } >> "$GITHUB_ENV"

      - name: Check out PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Restore-only for the Bun and Cargo entries: cache-warm.yml populates those on main, where
      # every pull request can read them. The Gradle cache is filled by `eas build --local`,
      # which runs here and on main during a release.
      - name: Prepare the runner
        id: setup
        uses: ./.github/actions/eas-local-build-setup
        with:
          platform: android
          eas-cli-version: ${{ env.EAS_CLI_VERSION }}

      - name: Verify EAS log isolation
        run: bash scripts/test-eas-ci-log-isolation.sh

      - name: Build the standalone Release locally
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$EAS_LOCAL_BUILD_ARTIFACTS_DIR" "$EAS_LOCAL_BUILD_WORKINGDIR"
          bash scripts/eas-local-build-ci.sh \
            android \
            production-internal-android \
            "$BUILD_ARTIFACT"

      # actions/cache's own post step is `post-if: success()`, so a 40-minute build that fails
      # would otherwise discard the Gradle downloads it just made and leave the retry cold.
      - name: Save Gradle dependency cache
        if: "!cancelled() && steps.setup.outputs.native-cache-hit != 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
            ~/.gradle/wrapper
          key: ${{ steps.setup.outputs.native-cache-key }}

      # Join the tailnet so the internal distribution host is reachable. The
      # ephemeral node is torn down at job end. Nothing prints the tailnet
      # topology (no `tailscale status`), keeping it off the public logs.
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Bland fixed node name so the tailnet admin view shows nothing
          # identifying, and no `tailscale status` is ever run. MagicDNS stays on
          # (the internal host resolves through the tailnet); the tailnet name the
          # action prints while configuring DNS is redacted by the TS_TAILNET
          # secret registered in the top-level env.
          hostname: ci-ephemeral

      - name: Upload the build to the internal distribution server
        id: upload
        env:
          DISTRIBUTOR_BASE_URL: ${{ secrets.DISTRIBUTOR_BASE_URL }}
          DISTRIBUTOR_TOKEN: ${{ secrets.DISTRIBUTOR_TOKEN }}
        run: |
          set -euo pipefail
          # Suppress all output: the install URL and internal host must not reach
          # the public logs. The masked install path is written to $GITHUB_OUTPUT
          # for the notify job to post to Discord.
          if ! bash scripts/upload-build.sh android "$BUILD_ARTIFACT" >/dev/null 2>&1; then
            echo "Uploading the build to the internal distribution server failed." >&2
            exit 1
          fi

      - name: Remove local build state
        if: always()
        run: |
          set -euo pipefail
          for path in \
            "${EAS_LOCAL_BUILD_ARTIFACTS_DIR:-}" \
            "${EAS_LOCAL_BUILD_WORKINGDIR:-}"; do
            if [[ -z "$path" ]]; then
              continue
            fi
            if [[ "$path" != "$RUNNER_TEMP/"* ]]; then
              echo "Refusing to clean unexpected path: $path" >&2
              exit 1
            fi
            if [[ -d "$path" ]]; then
              find "$path" -depth -delete
            fi
          done
          if [[ -n "${BUILD_ARTIFACT:-}" ]]; then
            rm -f -- "$BUILD_ARTIFACT"
          fi

  notify:
    name: Notify build thread
    # Same gate as the build jobs — anything they built gets reported. An author
    # allowlist here silently dropped reports for PRs that did build (the Copilot
    # agent reports `Copilot`, not `copilot-swe-agent[bot]`); the fork check is
    # what actually keeps secrets away from untrusted heads.
    if: >-
      ${{
        always() &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs:
      - build_ios
      - build_android
    runs-on: ubuntu-24.04
    # Required to read DISCORD_WEBHOOK_URL, which is an environment secret.
    environment: development-builds
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      IOS_RESULT: ${{ needs.build_ios.result }}
      ANDROID_RESULT: ${{ needs.build_android.result }}
      IOS_PATH: ${{ needs.build_ios.outputs.install_path }}
      ANDROID_PATH: ${{ needs.build_android.outputs.install_path }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISTRIBUTOR_BASE_URL: ${{ secrets.DISTRIBUTOR_BASE_URL }}
    steps:
      # The notify script (scripts/notify-discord-thread.sh) lives in the repo,
      # so this job needs the sources checked out just like the build jobs.
      - name: Check out PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Posts one combined build reply into the PR's Discord forum thread
      # (creating it on the first commit). Install links go ONLY to Discord; the
      # PR comment carries no link or host — just build status and the hidden
      # thread-id marker used to reuse the same thread on later commits.
      - name: Notify the PR build thread
        run: |
          set -euo pipefail

          marker='<!-- streetcryptid-builds -->'

          # Find our existing status comment and any thread id stored in it.
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100")"
          comment_id="$(jq -r --arg m "$marker" 'map(select(.body | contains($m)))[0].id // empty' <<<"$comments")"
          existing_thread="$(
            jq -r --arg m "$marker" 'map(select(.body | contains($m)))[0].body // ""' <<<"$comments" |
              sed -n 's/.*<!-- disc-thread:\([0-9]\{1,\}\) -->.*/\1/p'
          )"

          # Rebuild the full install URLs from the non-secret paths + the (secret)
          # base URL. Empty path => that platform's build/upload didn't produce one.
          base="${DISTRIBUTOR_BASE_URL%/}"
          ios_url=""
          android_url=""
          [[ -n "${IOS_PATH:-}" ]] && ios_url="${base}${IOS_PATH}"
          [[ -n "${ANDROID_PATH:-}" ]] && android_url="${base}${ANDROID_PATH}"

          # Post to Discord with all output suppressed — no URL, host, or webhook
          # may reach the public logs. The thread id comes back in a file, and a
          # redacted diagnostic (HTTP code / stage only) in another for debugging.
          tid_file="$RUNNER_TEMP/discord-thread-id"
          diag_file="$RUNNER_TEMP/discord-diag"
          : > "$tid_file"
          : > "$diag_file"
          discord_ok=1
          if ! DISCORD_THREAD_ID="$existing_thread" DISCORD_THREAD_ID_OUT="$tid_file" \
                NOTIFY_DIAG_FILE="$diag_file" \
                IOS_URL="$ios_url" ANDROID_URL="$android_url" \
                bash scripts/notify-discord-thread.sh >/dev/null 2>&1; then
            discord_ok=0
          fi
          thread_id="$(cat "$tid_file" 2>/dev/null || true)"
          [[ -z "$thread_id" ]] && thread_id="$existing_thread"

          # PR status comment: no links, no host — status plus the hidden thread
          # marker so the next commit reuses this thread.
          platform_line() {
            if [[ "$2" == "success" ]]; then
              printf -- '- **%s:** ✅ ready — install link in the team channel thread\n' "$1"
            else
              printf -- '- **%s:** ❌ build failed — [logs](%s)\n' "$1" "$RUN_URL"
            fi
          }
          body="$(
            printf '%s<!-- disc-thread:%s -->\n' "$marker" "$thread_id"
            printf '🏗️ **PR standalone Release builds**\n\n'
            platform_line "iOS" "$IOS_RESULT"
            platform_line "Android" "$ANDROID_RESULT"
            printf '\nInstall links are posted to the private team channel thread for this PR and kept off this public repo.'
            if [[ "$discord_ok" -ne 1 ]]; then
              printf '\n\n_⚠️ Could not reach the Discord build thread this run._'
            fi
          )"

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --raw-field body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --raw-field body="$body" >/dev/null
          fi

          if [[ "$discord_ok" -ne 1 ]]; then
            echo "Failed to notify the Discord build thread." >&2
            # The diagnostic is redacted by construction (HTTP status + stage only,
            # never a URL, host, webhook, or response body).
            if [[ -s "$diag_file" ]]; then
              echo "Diagnostic:" >&2
              cat "$diag_file" >&2
            fi
            exit 1
          fi
