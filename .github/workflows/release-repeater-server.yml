name: Release / repeater server

# Builds and publishes the trail-stash container image and Helm chart to GHCR, and cuts the
# server's releases. Moved from the trail-stash repository's `publish.yml` (docs/MONOREPO.md,
# "Releases").
#
# Every push to main that touches the server:
#   - image :latest + :sha-<short>, chart 0.0.0-<short> (appVersion sha-<short>). Production
#     tracks exactly this: the HelmRelease pins the chart to 0.0.0-<sha> and the pod follows :latest
#     by digest. `<short>` is a commit of this repository.
#   - and when scripts/next-server-version.sh finds a releasable Conventional Commit since the last
#     `server-v*` tag (the app's rules, scripts/lib/conventional-commits.sh): image :x.y.z + :x.y,
#     chart x.y.z, then the tag `server-vx.y.z` on that commit. The tag is pushed LAST, so a failed
#     publish never leaves a release behind that has nothing in it.
#
# A tag pushed by hand (`server-v1.2.3`) still publishes that version on its own. The tag this
# workflow pushes does not start it again: GITHUB_TOKEN pushes never trigger workflows.
#
# The path filter is what keeps an app commit from rolling the stash pod. It names the server, the
# protocol it links, the build context's ignore file and this workflow.
#
# The image and chart packages were created by the trail-stash repository. Each needs this
# repository granted write under its "Manage Actions access", or the push fails with a 403.

on:
  push:
    branches:
      - main
    paths:
      - repeater/server/**
      - repeater/protocol/**
      - .dockerignore
      - .github/workflows/release-repeater-server.yml
    tags:
      - server-v*.*.*
  workflow_dispatch:
    inputs:
      bump:
        description: Release to cut. `auto` follows the Conventional Commits since the last server tag.
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: read

concurrency:
  # Releases move a tag and :latest, so they must never overlap, and a queued one must not be
  # thrown away (it would compute its version from the tags the previous one pushed).
  group: release-repeater-server
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RUST_TOOLCHAIN: 1.97.0

jobs:
  # ---- gate: fast pure-core unit tests (no iroh) --------------------------------
  test:
    name: Test (pure core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: repeater/server
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Restore Rust compilation cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: repeater/server -> target
          key: repeater-server
          save-if: false

      - name: cargo test (pure core)
        run: cargo test --locked --workspace

  # ---- what this run publishes ------------------------------------------------
  version:
    name: Resolve the release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      short: ${{ steps.ver.outputs.short }}
      release: ${{ steps.ver.outputs.release }}
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      push_tag: ${{ steps.ver.outputs.push_tag }}
      rolling: ${{ steps.ver.outputs.rolling }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release
        id: ver
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#server-v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag $GITHUB_REF_NAME is not server-vMAJOR.MINOR.PATCH." >&2
              exit 1
            fi
            release=true
            tag="$GITHUB_REF_NAME"
            push_tag=false
            rolling=false
          else
            out="$(bash scripts/next-server-version.sh --force "$BUMP")"
            echo "$out"
            release="$(sed -n 's/^release=//p' <<<"$out")"
            version="$(sed -n 's/^version=//p' <<<"$out")"
            tag="$(sed -n 's/^tag=//p' <<<"$out")"
            # Releases are cut from main only; a dispatch on another branch publishes nothing
            # versioned.
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              release=false
            fi
            push_tag="$release"
            rolling=true
          fi
          {
            echo "short=${short}"
            echo "release=${release}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "push_tag=${push_tag}"
            echo "rolling=${rolling}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Repeater server"
            if [[ "$release" == "true" ]]; then
              echo "Release **${tag}** at \`${short}\`."
            else
              echo "No release: nothing since the last server tag that ships. Publishing \`sha-${short}\` only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- build + push the image, then package + push the chart -------------------
  image:
    name: Image
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image tags
        id: tags
        env:
          SHORT: ${{ needs.version.outputs.short }}
          RELEASE: ${{ needs.version.outputs.release }}
          VERSION: ${{ needs.version.outputs.version }}
          ROLLING: ${{ needs.version.outputs.rolling }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"           # GHCR requires a lowercase path
          image="${REGISTRY}/${owner}/trail-stash"
          tags=("${image}:latest")
          if [[ "$ROLLING" == "true" ]]; then
            tags+=("${image}:sha-${SHORT}")
          fi
          if [[ "$RELEASE" == "true" ]]; then
            tags+=("${image}:${VERSION}" "${image}:${VERSION%.*}")
          fi
          (IFS=,; echo "tags=${tags[*]}") >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: repeater/server/Dockerfile
          push: true
          # arm64 works but emulated Rust builds of the full iroh stack are very slow.
          # Add ",linux/arm64" here (and a docker/setup-qemu-action step above) if you need it.
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.description=Ciphertext-blind, stateless iroh-docs replica + push waker
          cache-from: type=gha,scope=trail-stash
          cache-to: type=gha,mode=max,scope=trail-stash

  chart:
    name: Chart
    needs:
      - version
      - image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Log in to the GHCR Helm registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | helm registry login "$REGISTRY" -u "$GHCR_USER" --password-stdin

      # 0.0.0-<short> on every main push (what production pins), x.y.z on a release.
      - name: Package and push charts
        env:
          SHORT: ${{ needs.version.outputs.short }}
          RELEASE: ${{ needs.version.outputs.release }}
          VERSION: ${{ needs.version.outputs.version }}
          ROLLING: ${{ needs.version.outputs.rolling }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          publish() {
            local chart_version="$1" app_version="$2"
            helm package repeater/server/charts/trail-stash \
              --version "$chart_version" \
              --app-version "$app_version" \
              --destination "$RUNNER_TEMP"
            helm push "$RUNNER_TEMP/trail-stash-${chart_version}.tgz" "oci://${REGISTRY}/${owner}/charts"
          }
          if [[ "$ROLLING" == "true" ]]; then
            publish "0.0.0-${SHORT}" "sha-${SHORT}"
          fi
          if [[ "$RELEASE" == "true" ]]; then
            publish "$VERSION" "$VERSION"
          fi

  # ---- record the release, only once everything in it exists -------------------
  tag:
    name: Tag the release
    needs:
      - version
      - image
      - chart
    if: needs.version.outputs.push_tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Push the tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$TAG" --message "Repeater server ${TAG#server-v}" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
