name: Warm PR build caches

# GitHub Actions caches are only readable from the ref that wrote them and that ref's ancestors.
# `pr-development-builds.yml` runs on `pull_request`, so everything it saved landed in
# refs/pull/<n>/merge and no other pull request could ever read it -- while still counting against
# the repository's 10 GB budget and evicting main's shared caches. This workflow does the Cargo and
# package-manager work of those builds on main so every pull request can restore it, and the build
# jobs themselves are restore-only.
#
# It deliberately does not run `eas build --local`: only the inputs that populate the caches are
# needed, and no EAS credentials are involved.
#
# Running scripts/eas-build-pre-install.sh here also stages the finished native artifacts (the .so
# per ABI, the iOS XCFramework, and the UniFFI bindings generated with them) into the cache that
# .github/actions/eas-native-cache manages. That is the entry that lets a pull request touching no
# Rust skip the native build entirely -- which is most of them. Note that this job builds ALL three
# Android ABIs while a pull-request build asks for arm64-v8a alone: the staged entry is per-ABI, so
# the narrower request still hits it.

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/eas-js-cache/action.yml
      - .github/actions/eas-local-build-setup/action.yml
      - .github/actions/eas-native-cache/action.yml
      - .github/actions/eas-rust-cache/action.yml
      - .github/workflows/cache-warm.yml
      - bun.lock
      - package.json
      - modules/iroh-location/rust/**
      - scripts/eas-build-pre-install.sh
      - scripts/generate-uniffi-bindings.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Let an in-flight warm finish rather than leaving a partially compiled target directory as the
  # cache for that key; a superseded run just no-ops because the entry already exists.
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EAS_CLI_VERSION: 21.0.3

jobs:
  warm_ios:
    name: Warm iOS build caches
    # Must match build_ios's runner in pr-development-builds.yml: runner.os/runner.arch are part
    # of both cache keys, and the cached Cargo artifacts are image-specific.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the runner
        uses: ./.github/actions/eas-local-build-setup
        with:
          platform: ios
          eas-cli-version: ${{ env.EAS_CLI_VERSION }}
          save-caches: 'true'
          # `eas build --local` is what fills the CocoaPods cache, and this job never runs it.
          native-dependency-cache: 'false'

      - name: Build the iOS native dependencies
        env:
          EAS_BUILD_PLATFORM: ios
        run: bash scripts/eas-build-pre-install.sh

  warm_android:
    name: Warm Android build caches
    # Must match build_android's runner in pr-development-builds.yml: runner.os/runner.arch are
    # part of both cache keys, and the cached Cargo artifacts are image-specific.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the runner
        uses: ./.github/actions/eas-local-build-setup
        with:
          platform: android
          eas-cli-version: ${{ env.EAS_CLI_VERSION }}
          save-caches: 'true'
          # `eas build --local` is what fills the Gradle cache, and this job never runs it.
          native-dependency-cache: 'false'

      - name: Build the Android native dependencies
        env:
          EAS_BUILD_PLATFORM: android
        run: bash scripts/eas-build-pre-install.sh
