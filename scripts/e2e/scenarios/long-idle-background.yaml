name: long-idle-background
description: 'One simulator, backgrounded and stationary for just over one refresh interval (the periodic bg.refresh wake is requested at ~15 min; the OS throttles further). Confirms the app keeps waking and checking in over a longer idle stretch rather than only across a short scripted route.'
kind: single
devices: 1
duration_seconds: 1000
route: stationary
background: true
force_quit_after_seconds: 0
thrash: false
require_stash_observer: false
assertions:
  - action: device.health
    min_count: 2
  - action: bg.refresh
    min_count: 1
