# VENDORED THIRD-PARTY CRATE — AGPL-3.0-or-later. See ./LICENSE and ./NOTICE.
# Upstream: https://github.com/mcginty/iroh-ble-transport tag iroh-ble-transport-v0.5.1-beta.7
# (first vendored at v0.3.1, rebased onto 0.5.1-beta.7 on 2026-11-02). Modified by the
# streetCryptid project and standalone-ized (no workspace inheritance). See ./NOTICE.
[package]
name = "iroh-ble-transport"
version = "0.5.1-beta.7"
edition = "2024"
rust-version = "1.95"
authors = ["Jake McGinty <me@jakebot.org>"]
license = "AGPL-3.0-or-later"
description = "BLE transport for the iroh peer-to-peer networking stack (vendored)"
repository = "https://github.com/mcginty/iroh-ble-transport"
keywords = ["bluetooth", "ble", "iroh", "p2p", "transport"]
categories = ["network-programming"]
publish = false

[features]
testing = []

[dependencies]
blew = { path = "../blew" }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tokio-stream = "0.1"
bytes = "1"
atomic-waker = "1"
iroh = { version = "1.4", features = ["unstable-custom-transports"] }
iroh-base = "1"
n0-watcher = "1"
n0-future = "0.3"
# Tracks iroh's own `noq-udp` requirement: `RecvMeta` appears in the
# `CustomEndpoint::poll_recv` signature, so this is an unsealed public
# dependency and the two must resolve to the same version.
noq-udp = "1.1"
async-stream = "0.3"
parking_lot = "0.12"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
arc-swap = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rand = "0.10"
blew = { path = "../blew", features = ["testing"] }
proptest = "1"

[profile.test.package.proptest]
opt-level = 3

[profile.test.package.rand_chacha]
opt-level = 3
