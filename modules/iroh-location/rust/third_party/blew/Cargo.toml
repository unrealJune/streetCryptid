# Upstream: https://github.com/mcginty/blew tag blew-v0.5.1-beta.8 (crates/blew); first
# vendored at blew-v0.3.0 and rebased onto beta.8 on 2026-11-02.
# Modified by the streetCryptid project: see ./NOTICE.
# The Android Kotlin half lives in modules/iroh-location/android (see build.rs).
[package]
name = "blew"
version = "0.5.1-beta.8"
edition = "2024"
authors = ["Jake McGinty <me@jakebot.org>"]
license = "AGPL-3.0-or-later"
description = "Cross-platform async BLE library for Rust (Apple, Linux, Android)"
repository = "https://github.com/mcginty/blew"
keywords = ["bluetooth", "ble", "gatt", "l2cap"]
categories = ["hardware-support", "network-programming"]
links = "blew"
publish = false

[features]
testing = []

[dependencies]
uuid = { version = "1", features = ["v4"] }
bitflags = "2"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = [
    "sync",
    "rt",
    "io-util",
    "macros",
    "time",
] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"
bytes = "1"
parking_lot = "0.12"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `test-util` gives the tests a paused clock, so a 35 s bound is asserted
# without spending 35 s or racing a loaded CI machine.
tokio = { version = "1", features = ["test-util", "macros", "rt"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSDate",
    "NSString",
    "NSUUID",
    "NSArray",
    "NSDictionary",
    "NSObject",
    "NSError",
    "NSRunLoop",
    "NSValue",
    "NSStream",
] }
objc2-core-bluetooth = { version = "0.3", features = ["CBError", "CBCentralManagerConstants"] }
dispatch2 = { version = "0.3", features = ["alloc", "objc2"] }
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["full"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
serde_json = "1"

[lints.clippy]
unseparated_literal_suffix = "warn"
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
used_underscore_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
default_trait_access = "allow"
