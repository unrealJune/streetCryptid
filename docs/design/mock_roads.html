<!doctype html>
<!--
  streetCryptid — ROAD WIDTH LAB
  ==============================
  A side-by-side harness for the "at some zooms the whole map goes grey" problem:
  road strokes at z12–z14 are wider than the block spacing, so the street mask
  fills solid and every dot lights up as road.

  This is NOT the app. It is a faithful re-implementation of the parts of the
  shipped pipeline that decide how thick a road reads:

    src/features/map/core/road-lod.ts      ROAD_WIDTHS, CLASS_MIN_ZOOM, roadWidthScale
    src/features/map/core/masks.ts         ROAD_VALUES (mask brightness per class)
    src/features/map/render/mask-image.ts  round-capped strokes, max-blended
    src/features/map/render/dot-field-shader.ts
                                           DOT_STEP=2, sampleMax over ±0.4·step,
                                           sv>28 → street dot, radius/alpha ramps

  Geometry is the real baked OSM from `mapdata.js`, projected with the app's own
  web-mercator + `scaleFor(zoom) = 256·2^zoom`, so a panel labelled z13 has the
  same road-density-per-pixel the device does at z13.

  Open with query params, or drive the controls:
    mock_roads.html?theme=daybreak&data=caphill&zooms=12,13,14,15
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>streetCryptid — road width lab</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#0a1420;--panel:#0b1826;--ink:#DCEBF0;--steel:#8AA6B2;--line:#17293a;--amber:#EDA23C;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:12px}
  header{padding:18px 22px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-family:'Rajdhani',sans-serif;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
  .sub{color:var(--steel);max-width:74ch;line-height:1.5}
  .bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line)}
  .bar label{color:var(--steel);letter-spacing:.06em;text-transform:uppercase;font-size:10px}
  select,input[type=text]{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
  main{padding:18px 22px 40px}
  table{border-collapse:separate;border-spacing:10px 12px}
  th{font-weight:400;color:var(--steel);letter-spacing:.1em;text-transform:uppercase;font-size:10px}
  th.zoom{padding-bottom:2px}
  td.name{vertical-align:top;text-align:left;width:236px}
  .vname{font-family:'Rajdhani',sans-serif;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
  .vnote{color:var(--steel);line-height:1.5;margin-top:3px}
  .vcfg{color:var(--steel);opacity:.8;margin-top:6px;line-height:1.45;word-break:break-word}
  .panel{position:relative;width:220px;height:220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .panel canvas{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:pixelated}
  .cov{position:absolute;right:5px;bottom:4px;background:rgba(6,12,20,.72);border-radius:4px;padding:1px 5px;font-size:10px;letter-spacing:.06em}
  .cov b{color:var(--amber);font-weight:600}
  .hot{color:#ff8080}
  .warn{color:var(--amber)}
  .ok{color:#7ad69a}
  .legend{margin-top:18px;color:var(--steel);line-height:1.6;max-width:100ch}
  .legend code{color:var(--ink)}
  .sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px;padding:0 22px 14px;max-width:1200px}
  .sliders div{display:flex;align-items:center;gap:8px;color:var(--steel)}
  .sliders input[type=range]{flex:1;accent-color:var(--amber)}
  .sliders b{color:var(--ink);font-weight:600;min-width:34px;text-align:right}
  .cfgout{margin:0 22px 16px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--steel);white-space:pre-wrap;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>Road width lab</h1>
  <div class="sub">
    Same geography, same dot field, four stroke-width policies. <b>COV</b> is the share of
    lattice dots the mask classifies as road — the grey-out number. Above ~55% the map stops
    reading as streets and starts reading as fog.
  </div>
</header>

<div class="bar">
  <label for="theme">theme</label>
  <select id="theme"><option>daybreak</option><option>deepsea</option><option>nocturne</option></select>
  <label for="data">geography</label>
  <select id="data"><option>caphill</option><option>union</option><option>greenlk</option><option>core</option></select>
  <label for="zooms">zooms</label>
  <input id="zooms" type="text" value="12,13,14,15" size="14" />
  <label for="tweak">live tweak</label>
  <select id="tweak"><option value="off">off</option><option value="on">on (row 5)</option></select>
</div>

<div class="sliders" id="sliders" hidden></div>
<div class="cfgout" id="cfgout" hidden></div>

<main><div id="grid"></div>
  <div class="legend" id="legend"></div>
</main>

<script src="mapdata.js"></script>
<script>
// ---------------------------------------------------------------------------
// Palette — copied from the shipped themes (mock_real.html / constants/theme).
// ---------------------------------------------------------------------------
const THEMES={
  daybreak:{BG:[236,240,244],ACC:[214,124,26],
    TERR:[[0,[176,190,200]],[.4,[108,132,148]],[.72,[52,84,106]],[1,[20,44,64]]],
    WATER:[[0,[150,192,224]],[.5,[74,140,196]],[1,[30,104,170]]],
    PARK:[[0,[158,200,168]],[.5,[80,164,110]],[1,[34,128,80]]]},
  deepsea:{BG:[9,18,30],ACC:[240,166,64],
    TERR:[[0,[34,66,74]],[.45,[46,120,130]],[.72,[120,196,198]],[1,[212,236,234]]],
    WATER:[[0,[26,74,128]],[.5,[38,110,176]],[1,[86,168,232]]],
    PARK:[[0,[30,84,58]],[.5,[54,140,86]],[1,[120,206,132]]]},
  nocturne:{BG:[12,12,30],ACC:[244,110,136],
    TERR:[[0,[44,42,78]],[.42,[96,100,168]],[.72,[168,176,220]],[1,[236,238,250]]],
    WATER:[[0,[38,44,104]],[.5,[62,80,180]],[1,[104,132,236]]],
    PARK:[[0,[36,64,78]],[.5,[58,124,132]],[1,[110,196,190]]]}
};

// ---------------------------------------------------------------------------
// Shipped pipeline constants (keep in step with src/features/map).
// ---------------------------------------------------------------------------
const DOT_STEP=2.0;                                  // render/shader-uniforms.ts
const ROAD_VALUES=[128,170,205,225,245];             // core/masks.ts
const LOD_FULL_ZOOM=14, LOD_COARSE_ZOOM=11;          // render/shader-uniforms.ts

// A width policy: base stroke px per class, the zoom taper, and the per-class
// cut-off zoom. `current` is exactly what ships today (core/road-lod.ts).
const VARIANTS=[
  {id:'current',name:'Current (shipped)',
   note:'ROAD_WIDTHS × roadWidthScale(z), taper 0.6→1 across z11–14.',
   widths:[2.2,3.0,4.2,5.4,7.0], floor:0.60, lo:11, hi:14, min:[13.5,12.0,9.0,7.0,0], values:ROAD_VALUES},
  {id:'thin',name:'A · Thin ladder',
   note:'Same LOD, every stroke ~30% thinner. Cheapest possible change.',
   widths:[1.5,2.0,2.8,3.6,4.8], floor:0.60, lo:11, hi:14, min:[13.5,12.0,9.0,7.0,0], values:ROAD_VALUES},
  {id:'taper',name:'B · Harder taper',
   note:'Shipped widths, but the taper floor drops to 0.35 and runs z10–15, so zooming out thins roads instead of merging them.',
   widths:[2.2,3.0,4.2,5.4,7.0], floor:0.35, lo:10, hi:15, min:[13.5,12.0,9.0,7.0,0], values:ROAD_VALUES},
  {id:'late',name:'C · Later classes',
   note:'Shipped widths, but small classes leave earlier: a class is dropped before its grid spacing shrinks under its own stroke.',
   widths:[2.2,3.0,4.2,5.4,7.0], floor:0.60, lo:11, hi:14, min:[14.5,13.5,11.0,8.5,0], values:ROAD_VALUES},
  {id:'combo',name:'D · Combined (proposed)',
   note:'A + B + C together, plus a dimmer ladder for the two smallest classes so a residential grid reads as texture rather than a lit surface. The one that never crosses 50% anywhere in z11–16.',
   widths:[1.5,2.0,2.9,3.8,5.0], floor:0.40, lo:11, hi:15, min:[15.0,13.5,11.0,8.5,0], values:[104,146,190,220,245]}
];

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lodForZoom=z=>clamp((LOD_FULL_ZOOM-z)/(LOD_FULL_ZOOM-LOD_COARSE_ZOOM),0,1);
function widthScale(z,v){return clamp(v.floor+(1-v.floor)*(z-v.lo)/(v.hi-v.lo),v.floor,1);}
function widthFor(cls,z,v){return z<v.min[cls]?null:v.widths[cls]*widthScale(z,v);}
function hash2(x,y){const s=Math.sin(x*12.9898+y*78.233)*43758.5453;return s-Math.floor(s);}
function ramp(st,t){t=clamp(t,0,1);for(let i=0;i<st.length-1;i++){if(t<=st[i+1][0]){const a=st[i],b=st[i+1],k=(t-a[0])/((b[0]-a[0])||1);
  return[a[1][0]+(b[1][0]-a[1][0])*k,a[1][1]+(b[1][1]-a[1][1])*k,a[1][2]+(b[1][2]-a[1][2])*k];}}return st[st.length-1][1];}
// core/mercator.ts
function toWorld(lat,lon){const s=Math.sin(clamp(lat,-85.05,85.05)*Math.PI/180);
  return[lon/360+0.5,0.5-Math.log((1+s)/(1-s))/(4*Math.PI)];}
const scaleFor=z=>256*Math.pow(2,z);

// ---------------------------------------------------------------------------
// One panel: build the street mask, then run the dot field over it.
// Returns the share of lattice dots that came back "road" (the grey number).
// ---------------------------------------------------------------------------
function renderPanel(canvas,{data,zoom,variant,theme,size}){
  const T=THEMES[theme]||THEMES.daybreak;
  const W=size,H=size;
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');

  const [BS,BW,BN,BE]=data.bbox;
  const scale=scaleFor(zoom);
  const c0=toWorld((BS+BN)/2,(BW+BE)/2);
  const px=(lat,lon)=>{const w=toWorld(lat,lon);return[(w[0]-c0[0])*scale+W/2,(w[1]-c0[1])*scale+H/2];};

  // --- street mask (render/mask-image.ts): round caps/joins, brightest wins ---
  const mc=document.createElement('canvas');mc.width=W;mc.height=H;
  const mx=mc.getContext('2d');
  mx.fillStyle='#000';mx.fillRect(0,0,W,H);
  mx.lineCap='round';mx.lineJoin='round';mx.globalCompositeOperation='lighter';
  const ways=data.ways.filter(w=>w.k==='s').sort((a,b)=>a.c-b.c);
  for(const w of ways){
    const width=widthFor(w.c,zoom,variant);
    if(width===null)continue;
    const g=variant.values[w.c];
    mx.strokeStyle=`rgb(${g},${g},${g})`;mx.lineWidth=width;
    mx.beginPath();
    for(let i=0;i<w.g.length;i++){const p=px(w.g[i][0],w.g[i][1]);i?mx.lineTo(p[0],p[1]):mx.moveTo(p[0],p[1]);}
    mx.stroke();
  }
  const M=mx.getImageData(0,0,W,H).data;
  const at=(x,y)=>{const xi=clamp(Math.round(x),0,W-1),yi=clamp(Math.round(y),0,H-1);return Math.min(255,M[(yi*W+xi)*4]);};

  // --- dot field (render/dot-field-shader.ts, exploration off) ---
  ctx.fillStyle=`rgb(${T.BG[0]},${T.BG[1]},${T.BG[2]})`;ctx.fillRect(0,0,W,H);
  const lod=lodForZoom(zoom), o=DOT_STEP*0.4;
  let road=0,total=0;
  for(let iy=0,y=DOT_STEP/2;y<H;y+=DOT_STEP,iy++){
    for(let ix=0,x=DOT_STEP/2;x<W;x+=DOT_STEP,ix++){
      const n=hash2(ix,iy);
      const sv=Math.max(at(x,y),at(x+o,y),at(x-o,y),at(x,y+o),at(x,y-o));
      total++;
      let val,col;
      if(sv>28){road++;val=clamp(sv/255,0,1);col=ramp(T.TERR,val);}
      else{
        if(n<0.2+lod*0.35)continue;
        val=clamp(0.24+0.13*n,0,1);col=ramp(T.TERR,val);
      }
      const alpha=(sv>28?1.0:0.70);
      const radius=(0.3+0.85*val)*1.15;
      ctx.globalAlpha=alpha;
      ctx.fillStyle=`rgb(${col[0]|0},${col[1]|0},${col[2]|0})`;
      ctx.beginPath();ctx.arc(x,y,radius,0,6.2832);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  return total?road/total:0;
}

// ---------------------------------------------------------------------------
// Grid
// ---------------------------------------------------------------------------
const params=new URLSearchParams(location.search);
const el=id=>document.getElementById(id);
const state={
  theme:params.get('theme')||'daybreak',
  data:params.get('data')||'caphill',
  zooms:(params.get('zooms')||'12,13,14,15').split(',').map(Number).filter(z=>z>0),
  tweak:params.get('tweak')||'off'
};
el('theme').value=state.theme;el('data').value=state.data;
el('zooms').value=state.zooms.join(',');el('tweak').value=state.tweak;

// The live-tweak row starts from the proposal so we can nudge it together.
const live=JSON.parse(JSON.stringify(VARIANTS[4]));
live.id='live';live.name='LIVE · your tweak';live.note='Drive it with the sliders above; the config block is copy-paste ready for core/road-lod.ts.';

const SLIDERS=[
  ['w0','class 0 · service/path',0.5,6,0.1,v=>live.widths[0]=v,()=>live.widths[0]],
  ['w1','class 1 · residential',0.5,6,0.1,v=>live.widths[1]=v,()=>live.widths[1]],
  ['w2','class 2 · secondary',0.5,8,0.1,v=>live.widths[2]=v,()=>live.widths[2]],
  ['w3','class 3 · primary',0.5,9,0.1,v=>live.widths[3]=v,()=>live.widths[3]],
  ['w4','class 4 · motorway',0.5,10,0.1,v=>live.widths[4]=v,()=>live.widths[4]],
  ['fl','taper floor',0.2,1,0.05,v=>live.floor=v,()=>live.floor],
  ['lo','taper start z',8,14,0.5,v=>live.lo=v,()=>live.lo],
  ['hi','taper end z',10,17,0.5,v=>live.hi=v,()=>live.hi],
  ['m0','min zoom · class 0',10,17,0.5,v=>live.min[0]=v,()=>live.min[0]],
  ['m1','min zoom · class 1',9,16,0.5,v=>live.min[1]=v,()=>live.min[1]],
  ['m2','min zoom · class 2',7,15,0.5,v=>live.min[2]=v,()=>live.min[2]],
  ['m3','min zoom · class 3',5,14,0.5,v=>live.min[3]=v,()=>live.min[3]]
];

function buildSliders(){
  const host=el('sliders');host.innerHTML='';
  for(const [id,label,min,max,step,set,get] of SLIDERS){
    const row=document.createElement('div');
    row.innerHTML=`<span style="min-width:150px">${label}</span>`;
    const input=document.createElement('input');
    input.type='range';input.min=min;input.max=max;input.step=step;input.value=get();
    const out=document.createElement('b');out.textContent=(+get()).toFixed(1);
    input.addEventListener('input',()=>{set(+input.value);out.textContent=(+input.value).toFixed(1);render();});
    row.appendChild(input);row.appendChild(out);host.appendChild(row);
  }
}

function cfgText(v){
  return `widths [${v.widths.map(w=>w.toFixed(1)).join(', ')}] · taper ${v.floor.toFixed(2)}→1 over z${v.lo}–${v.hi} · min z [${v.min.map(m=>m===0?'0':m.toFixed(1)).join(', ')}]`;
}

function covClass(p){return p>0.55?'hot':p>0.38?'warn':'ok';}

function render(){
  const data=(window.OSMSETS||{})[state.data];
  const variants=state.tweak==='on'?VARIANTS.concat([live]):VARIANTS;
  const grid=el('grid');
  const table=document.createElement('table');
  const head=document.createElement('tr');
  head.innerHTML='<th></th>'+state.zooms.map(z=>`<th class="zoom">z${z}</th>`).join('');
  table.appendChild(head);

  for(const v of variants){
    const tr=document.createElement('tr');
    const name=document.createElement('td');
    name.className='name';
    name.innerHTML=`<div class="vname">${v.name}</div><div class="vnote">${v.note}</div><div class="vcfg">${cfgText(v)}</div>`;
    tr.appendChild(name);
    for(const z of state.zooms){
      const td=document.createElement('td');
      const box=document.createElement('div');box.className='panel';
      const cv=document.createElement('canvas');
      box.appendChild(cv);td.appendChild(box);tr.appendChild(td);
      // Panels are a fixed 220 CSS px window. Zoomed-out geography is genuinely
      // tiny, so the canvas is rendered at true logical size and magnified with
      // nearest-neighbour — an honest loupe, never a re-scaled stroke width.
      const mag=z<=12?4:z<=13?2:1;
      const size=Math.round(220/mag);
      const pct=renderPanel(cv,{data,zoom:z,variant:v,theme:state.theme,size});
      cv.style.transform=`scale(${mag})`;
      const tag=document.createElement('div');tag.className='cov';
      tag.innerHTML=`COV <b class="${covClass(pct)}">${Math.round(pct*100)}%</b>`;
      box.appendChild(tag);
    }
    table.appendChild(tr);
  }
  grid.innerHTML='';grid.appendChild(table);
  el('cfgout').textContent=
`// core/road-lod.ts — LIVE row
export const ROAD_WIDTHS = [${live.widths.map(w=>w.toFixed(1)).join(', ')}] as const;
export const CLASS_MIN_ZOOM = [${live.min.map(m=>m.toFixed(1)).join(', ')}] as const;
export function roadWidthScale(zoom: number): number {
  return clamp(${live.floor} + (${(1-live.floor).toFixed(2)} * (zoom - ${live.lo})) / ${(live.hi-live.lo).toFixed(1)}, ${live.floor}, 1);
}`;
  el('legend').innerHTML=
    `<b>Reading the sheet.</b> Each row is one width policy; each column one build zoom. `+
    `<code>COV</code> counts lattice dots whose 5-tap <code>sampleMax</code> lands above the shader's `+
    `<code>sv &gt; 28</code> street threshold. At z13 a 100 m block is only ~5 logical px wide while a `+
    `residential stroke is ~2.6 px and the sample spread adds ±0.8 px on each side — which is why the `+
    `shipped row fills in. Nothing here changes the app; it is a lab for choosing the numbers.`;
  el('sliders').hidden=state.tweak!=='on';
  el('cfgout').hidden=state.tweak!=='on';
}

for(const [id,key] of [['theme','theme'],['data','data'],['tweak','tweak']]){
  el(id).addEventListener('change',()=>{state[key]=el(id).value;render();});
}
el('zooms').addEventListener('change',()=>{
  const zs=el('zooms').value.split(',').map(Number).filter(z=>z>0);
  if(zs.length){state.zooms=zs;render();}
});

buildSliders();
render();
</script>
</body>
</html>
