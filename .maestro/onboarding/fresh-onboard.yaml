appId: com.unrealjune.streetcryptid
---
# Wipes the app's local state (equivalent to uninstall+reinstall) so onboarding
# starts from a genuinely fresh profile, then drives the splash, the username and delivery steps and the
# permission steps through to the live map. Run per-device with --udid
# so each simulator gets its own clean identity, e.g.:
#   maestro --udid <UDID> test -e USERNAME=alice .maestro/onboarding/fresh-onboard.yaml
#
# NOTE: text/label-based tapOn works fine for Pressable buttons in this app, but
# does NOT reliably focus TextInputs under Maestro's synthetic iOS taps (button
# taps go through fine; TextInput focus silently no-ops with no keyboard, no
# cursor, no typed text, and no error). Selecting by `id:` (testID -> UIKit
# accessibilityIdentifier) fixes it. If you add a new fillable field, give it a
# testID and select it by id, not by label/placeholder text.
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: 'Go home'
      timeout: 4000
    commands:
      - tapOn: 'Close'
# The first-launch splash: one action, in the island or (iPhone Duo) the system rail.
- tapOn:
    id: 'onboarding-splash-continue'
- assertVisible:
    id: 'username-input'
- tapOn:
    id: 'username-input'
- inputText: '${USERNAME}'
- hideKeyboard
- tapOn:
    id: 'onboarding-continue'
# The first-run privacy read, between the persona and the route choice.
- scrollUntilVisible:
    element:
      id: 'onboarding-privacy-continue'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'onboarding-privacy-continue'
- scrollUntilVisible:
    element:
      id: 'onboarding-delivery-continue'
      enabled: true
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'onboarding-delivery-continue'
    enabled: true
# One screen per permission (PermissionsGate): the overview when there is more than one, then each
# step's continue. Steps the OS already grants are skipped, and launchApp grants most of them, so
# how many steps appear varies by platform — hence a loop rather than a fixed list.
- runFlow:
    when:
      visible:
        id: 'permission-intro-continue'
      timeout: 15000
    commands:
      - tapOn:
          id: 'permission-intro-continue'
- repeat:
    times: 10
    while:
      visible:
        id: 'permission-step-continue'
    commands:
      - tapOn:
          id: 'permission-step-continue'
- assertVisible:
    id: 'map-view'
