appId: com.unrealjune.streetcryptid
---
# Run on either device once pairing completes: asserts the "CRYPTID DISCOVERED"
# reveal appeared, then confirms adding the friend and sharing location.
#
# No `launchApp`: harmless by this point (pairing is done, not mid-handshake), but
# kept consistent with the rest of the pairing/ flows — see pick-figure.yaml.
- assertVisible: 'CRYPTID DISCOVERED'
- tapOn:
    id: 'pairing-acknowledge-friend'
