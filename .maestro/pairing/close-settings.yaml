appId: com.unrealjune.streetcryptid
---
# Closes Settings via the real Close button. Deliberately does NOT call launchApp:
# on iOS, Maestro's launchApp appears to force a terminate+relaunch even with
# clearState: false, which tears down and rebuilds the native LocationNode —
# wiping any in-memory issued-invite record before it can be redeemed. Run this
# only while Settings is open. This helper does not close the separate Pair route: closing Pair
# would revoke its invitation, so the inviting phone must remain there until redemption.
#
# Settings is a menu with pages under it now, and "Close settings" only exists on the
# menu itself. Pop back to the menu first if we are on a subpage; the step is
# conditional because this flow is also run from the menu directly.
- runFlow:
    when:
      visible: 'Back to settings'
      timeout: 5000
    commands:
      - tapOn: 'Back to settings'
- scrollUntilVisible:
    element: 'Close settings'
    direction: UP
    timeout: 30000
- tapOn: 'Close settings'
