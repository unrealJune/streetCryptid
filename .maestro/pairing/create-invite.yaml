appId: com.unrealjune.streetcryptid
---
# Creates a one-time pairing invite and leaves Pair open. Read its displayed link via
# `maestro hierarchy` (id: debug-invite-link). Do not close Pair or relaunch the app
# before redemption: leaving the screen now revokes the invitation.
- launchApp:
    clearState: false
- tapOn: 'Settings'
- tapOn: 'Pair'
- tapOn: 'Make a link'
- tapOn: 'Copy'
- assertVisible:
    id: 'debug-invite-link'
