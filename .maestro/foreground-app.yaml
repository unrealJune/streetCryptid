appId: com.unrealjune.streetcryptid
---
# Bring the app to the foreground and LEAVE it there — the counterpart to
# background-location/background-app.yaml, which ends with `pressKey: HOME`.
#
# Needed wherever a device has to keep serving rather than just be nudged. Peer-to-peer recovery
# is the case that forced it: a friend can only hand on an author's fix while its own node is
# actually running, and a backgrounded iOS app is suspended by the OS on its own schedule. Sending
# the relay to the background and then expecting it to answer a dial is testing something iOS does
# not offer.
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'Go home'
      timeout: 4000
    commands:
      - tapOn: 'Close'
- assertVisible:
    id: 'map-view'
