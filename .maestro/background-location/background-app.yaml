appId: com.unrealjune.streetcryptid
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: 'This is the developer menu. It gives you access to useful tools in development builds.'
    commands:
      - tapOn: 'Continue'
      - tapOn: 'Close'
- runFlow:
    when:
      visible: 'Go home'
    commands:
      - tapOn: 'Close'
- assertVisible:
    id: 'map-view'
- pressKey: HOME
