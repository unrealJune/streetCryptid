appId: com.unrealjune.streetcryptid
---
# iOS PROVISIONING — the dev-client dialogs a FRESH install shows before the app is reachable.
#
# This file deliberately did not exist for most of this harness's life, and the reasoning was
# sound at the time: iOS needs no permission UI (simctl grants everything up front), and every
# `maestro test` costs real seconds of driver startup, so an empty flow was pure latency on every
# device in every scenario. What that missed is the dev CLIENT, not the OS. A simulator that has
# never run this build lands in expo-dev-launcher, not in the app, and then shows the dev-menu
# onboarding overlay on top of it — so `ensure-onboarded.yaml` fails on `map-view` for a device
# that is, in every other respect, perfectly healthy. That is a one-time cost per install, which
# is exactly what provisioning is for (compare the Android developer-menu popup handled the same
# way in android.yaml).
#
# Everything is conditional and every condition carries an explicit `timeout`. maestro-runner's
# default condition timeout is 1000ms, which is shorter than these dialogs take to render — an
# earlier revision without them silently matched nothing and reported a flow of zero steps.

- launchApp:
    clearState: false

# expo-dev-launcher's server picker. Present only when the launcher did not auto-open the last
# bundle (a fresh install has no "last bundle" to open). Tapping the entry connects to Metro; the
# URL is matched loosely because the LAN address differs per machine.
- runFlow:
    when:
      visible: 'http://.*:8081'
      timeout: 6000
    commands:
      - tapOn: 'http://.*:8081'

# The dev-menu onboarding overlay, which renders OVER the app once it loads. Two buttons, and
# both have to be dismissed or the map underneath is unreachable to every later assertion.
- runFlow:
    when:
      visible: 'Continue'
      timeout: 8000
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible: 'Close'
      timeout: 4000
    commands:
      - tapOn: 'Close'
