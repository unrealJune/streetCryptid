apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "streetcrypt-id.fullname" . }}
  labels:
    {{- include "streetcrypt-id.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "streetcrypt-id.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "streetcrypt-id.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      # Clears the `restricted` Pod Security Standard.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Caddy writes to /data and /config (XDG dirs baked into the image). The emptyDirs below are
        # root-owned without this, and it runs as 1000.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              # Not because anything binds a privileged port -- it listens on 8080. The caddy image
              # ships /usr/bin/caddy with cap_net_bind_service as a FILE capability, and under
              # allowPrivilegeEscalation: false (no_new_privs) execve of a binary carrying file caps
              # the process does not already hold fails with EPERM: "exec /usr/bin/caddy: operation
              # not permitted", an immediate CrashLoopBackOff with no other output. Holding the
              # capability makes the exec grant nothing new. `restricted` permits adding back
              # exactly this one.
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          # Ready means the file that matters is being served, not merely that Caddy is up.
          readinessProbe:
            httpGet:
              path: /.well-known/assetlinks.json
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
