<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>streetCryptid</title>
    <meta
      name="description"
      content="Only you get to find your friends. Paired phones move on the same map, end-to-end encrypted and peer-to-peer. No accounts, no ads, no data brokers."
    />
    <meta name="theme-color" content="#eef2f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1420" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="landing">
    <canvas id="field" aria-hidden="true"></canvas>
    <div id="scrim" aria-hidden="true"></div>

    <div class="shell">
      <header class="masthead">
        <a class="wordmark" href="/"><span>street</span>Cryptid</a>
        <nav>
          <!-- No link to /pair: that page is only meaningful with an invite in the
               URL fragment, and reaching it without one is an error state. -->
          <a href="/repeater">Repeaters</a>
          <a href="https://github.com/unrealJune/streetCryptid">Source</a>
        </nav>
      </header>

      <main class="hero">
        <h1>Find your Friends</h1>
        <p class="lede">
          The idea is simple: only you get to find your friends, no data collection or sneaky
          middlemen in the way.
        </p>

        <!-- Closed testing, so these are a state and not a link. When the
             listings are public, turn each into an <a class="channel" href="…">
             and put the store name back in .state. The App Store URL needs its
             numeric id (/app/streetcryptid/id…); the bare slug does not resolve. -->
        <div class="channels">
          <div class="channel">
            <span class="platform">iOS</span>
            <span class="state">TestFlight</span>
          </div>
          <div class="channel">
            <span class="platform">Android</span>
            <span class="state">Closed testing</span>
          </div>
        </div>
      </main>

      <footer class="colophon micro">
        <span class="place" id="place">TOKYO · SHIBUYA</span>
        <span class="right">
          <a href="https://github.com/unrealJune/streetCryptid">AGPL-3.0</a>
          <span style="opacity: 0.7">streetcrypt.id</span>
        </span>
      </footer>
    </div>

    <script src="/field.js"></script>
    <script>
      if (window.startField) window.startField('field', 'place');
    </script>
  </body>
</html>
